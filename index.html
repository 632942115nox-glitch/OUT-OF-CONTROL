// ==================== 输入处理 ====================
const Input = {
  mouseX: 0,
  mouseY: 0,
  hoverCol: -1,
  hoverRow: -1,
  selectedTower: null,  // 当前选中的塔（已放置的）
  placingType: null,     // 正在放置的塔类型
  draggingTower: null,   // 正在拖动的塔
  DRAG_COST: [30, 50, 70], // 拖动金币：1级30/2级50/3级70

  init() {
    const canvas = $('#game-canvas');
    canvas.addEventListener('mousemove', (e) => this.onMouseMove(e));
    canvas.addEventListener('click', (e) => this.onClick(e));
    canvas.addEventListener('mousedown', (e) => this.onMouseDown(e));
    canvas.addEventListener('mouseup', (e) => this.onMouseUp(e));
    canvas.addEventListener('contextmenu', (e) => {
      e.preventDefault();
      // 右键点击已放置的塔 → 弹出升级窗口
      const grid = MapSystem.screenToGrid(this.mouseX, this.mouseY);
      const tower = MapSystem.getTowerAt(grid.col, grid.row);
      if (tower && GameState.state !== 'MENU') {
        this.selectedTower = tower;
        this.placingType = null;
        UI.updateAll();
        UI.showUpgradePopup(tower);
        TestLog.info('INPUT', `右键打开塔 #${tower.id} 升级窗口`);
      } else {
        // 右键空白处：取消选择
        this.placingType = null;
        this.selectedTower = null;
        UI.updateAll();
        TestLog.info('INPUT', '右键取消选择');
      }
    });
    document.addEventListener('keydown', (e) => this.onKeyDown(e));
  },

  // 拖动：准备阶段按住塔开始拖动
  onMouseDown(e) {
    if (!['PLAYING'].includes(GameState.state)) return;
    if (WaveManager.waveActive) return; // 只能在准备阶段拖动
    const grid = MapSystem.screenToGrid(this.mouseX, this.mouseY);
    const tower = MapSystem.getTowerAt(grid.col, grid.row);
    if (tower) {
      this.draggingTower = tower;
      this.selectedTower = tower;
      tower.dragging = true;
      tower.dragX = this.mouseX;
      tower.dragY = this.mouseY;
      TestLog.info('INPUT', `开始拖动塔 #${tower.id}（免费拖动）`);
    }
  },

  // 拖动结束：放置塔（免费拖动，无金币损耗）
  onMouseUp(e) {
    if (!this.draggingTower) return;
    const tower = this.draggingTower;
    const grid = MapSystem.screenToGrid(this.mouseX, this.mouseY);

    if (grid.col === tower.col && grid.row === tower.row) {
      // 放回原处
      tower.dragging = false;
      this.draggingTower = null;
      return;
    }

    if (MapSystem.canPlaceTower(grid.col, grid.row)) {
      MapSystem.removeTower(tower.col, tower.row);
      tower.col = grid.col;
      tower.row = grid.row;
      tower.x = grid.col * CONFIG.TILE_SIZE + CONFIG.TILE_SIZE / 2;
      tower.y = grid.row * CONFIG.TILE_SIZE + CONFIG.TILE_SIZE / 2;
      tower.dragging = false;
      MapSystem.placeTower(grid.col, grid.row, tower);
      TestLog.info('INPUT', `塔 #${tower.id} 拖动到 (${grid.col},${grid.row})（免费）`);
    } else {
      UI.showToast('无法拖动到此位置');
    }
    tower.dragging = false;
    this.draggingTower = null;
    UI.updateAll();
  },

  onMouseMove(e) {
    const rect = e.target.getBoundingClientRect();
    // 关键修复：canvas 实际渲染尺寸可能与内部分辨率(800x600)不同，
    // 需要按缩放比例换算鼠标坐标，否则点击/悬停会偏移
    const scaleX = CONFIG.CANVAS_W / rect.width;
    const scaleY = CONFIG.CANVAS_H / rect.height;
    this.mouseX = (e.clientX - rect.left) * scaleX;
    this.mouseY = (e.clientY - rect.top) * scaleY;

    // 拖动中：更新塔的拖动位置
    if (this.draggingTower) {
      this.draggingTower.dragX = this.mouseX;
      this.draggingTower.dragY = this.mouseY;
    }

    const grid = MapSystem.screenToGrid(this.mouseX, this.mouseY);
    this.hoverCol = grid.col;
    this.hoverRow = grid.row;
    this.hoverTower = MapSystem.getTowerAt(grid.col, grid.row);
    // 改变光标样式
    e.target.style.cursor = this.draggingTower ? 'grabbing' : (this.hoverTower ? 'pointer' : 'crosshair');
  },

  onClick(e) {
    if (!['PLAYING', 'PAUSED'].includes(GameState.state)) return;

    const grid = MapSystem.screenToGrid(this.mouseX, this.mouseY);

    // 先检查该位置是否已有塔（用于升级/出售）
    const existingTower = MapSystem.getTowerAt(grid.col, grid.row);

    // 无论是否处于放置模式，点击已有塔都应选中它（高亮显示）
    if (existingTower) {
      this.selectedTower = existingTower;
      this.placingType = null;
      TestLog.info('INPUT', `选中塔 #${existingTower.id} (${existingTower.typeDef.name})，右键打开升级`);
      UI.updateAll();
      return;
    }

    if (this.placingType) {
      // 尝试放置塔
      if (MapSystem.canPlaceTower(grid.col, grid.row)) {
        const typeDef = CONFIG.TOWER_TYPES[this.placingType];
        if (Economy.canAfford(typeDef.cost)) {
          Economy.spend(typeDef.cost);
          const tower = TowerSystem.create(this.placingType, grid.col, grid.row);
          Stats.towersPlaced++;

          // 成就检查
          const archerCount = TowerSystem.towers.filter(t => t.type === 'archer').length;
          const cannonCount = TowerSystem.towers.filter(t => t.type === 'cannon').length;
          if (archerCount >= 5) AchievementSystem.unlock('sharpshooter');
          if (cannonCount >= 3) AchievementSystem.unlock('demolition');
          if (Stats.kills >= 1) AchievementSystem.unlock('first_blood');

          if (tower) {
            this.selectedTower = tower;
          }
          this.placingType = null;
        } else {
          UI.showToast('金币不足！');
        }
      } else {
        UI.showToast('无法在此位置放置！');
        this.placingType = null;
      }
    } else {
      // 点击空地：取消选择
      this.selectedTower = null;
    }
    UI.updateAll();
  },

  onKeyDown(e) {
    // 菜单状态下不处理快捷键
    if (['MENU'].includes(GameState.state) &&
        !$('#overlay-settings').classList.contains('hidden')) return;

    switch (e.key) {
      case '1': this.placingType = 'archer'; this.selectedTower = null; TestLog.info('INPUT', '选择弓箭塔'); break;
      case '2': this.placingType = 'cannon'; this.selectedTower = null; TestLog.info('INPUT', '选择炮塔');  break;
      case '3': this.placingType = 'ice';    this.selectedTower = null; TestLog.info('INPUT', '选择冰塔');  break;
      case '4': this.placingType = 'magic';  this.selectedTower = null; TestLog.info('INPUT', '选择魔法塔'); break;
      case 'Escape':
        this.placingType = null;
        this.selectedTower = null;
        UI.hideUpgradePopup();
        TestLog.info('INPUT', '取消选择');
        break;
      case ' ':
        e.preventDefault();
        if (GameState.state === 'PLAYING') {
          this.pauseGame();
        } else if (GameState.state === 'PAUSED') {
          this.resumeGame();
        }
        break;
      case 'Enter':
        e.preventDefault();
        if (GameState.state === 'PLAYING' && !WaveManager.waveActive) {
          WaveManager.startWave();
        }
        break;
      case 'f':
      case 'F':
        if (GameState.state === 'PLAYING' || GameState.state === 'PAUSED') {
          GameLoop.toggleSpeed();
        }
        break;
      case 'u':
      case 'U':
        if (this.selectedTower && GameState.state === 'PLAYING') {
          TowerSystem.upgrade(this.selectedTower);
          Stats.towersUpgraded++;
          UI.updateAll();
        }
        break;
      case 's':
      case 'S':
        if (this.selectedTower && GameState.state === 'PLAYING') {
          TowerSystem.sell(this.selectedTower);
          Stats.towersSold++;
          this.selectedTower = null;
          UI.updateAll();
        }
        break;
    }
    UI.updateAll();
  },

  pauseGame() {
    if (GameState.transition('PAUSED')) {
      UI.showPause(true);
    }
  },

  resumeGame() {
    if (GameState.transition('PLAYING')) {
      UI.showPause(false);
    }
  }
};

  '破甲': '使目标护甲减少20%，每个抑制剂仅附加一次，可多个抑制剂叠加，最多同一个怪最多被附加3层',
  '低温日': '使自己攻击模式改为每次攻击造成基于自身伤害200%+目标当前生命3%的混合伤害（参与护甲减伤计算）',
  '弹射': '（机制）\n-弹射的分裂伤害也会参与怪物减伤计算\n\n-从A弹射到B（A→B），则A为弹射方，B为被弹射方\n\n-同时出现AB两个怪物时，攻击A怪物，会额外分裂攻击一次B怪物，此次伤害为对A怪物造成伤害的70%。此为连锁2目标；\n\n-同时出现ABC三个怪物时，攻击A怪物，会额外分裂攻击一次B怪物，此次伤害为对A怪物造成伤害的70%；对B怪物造成伤害时，会对怪物C进行相同行为，造成的伤害为对目标B造成伤害的70%。此为连锁3目标；\n\n-同时出现ABCD四个怪物时，攻击A怪物，会额外分裂攻击一次B怪物，此次伤害为对A怪物造成伤害的70%；对B怪物造成伤害时，会对怪物C进行相同行为，造成的伤害为对目标B造成伤害的70%；对C怪物造成伤害时，会对D怪物进行【共振】行为，对其造成A目标受到攻击的等额伤害。此为连锁4目标；',
  '满载': '-弹射伤害额外提升5%\n\n-弹射造成的伤害额外无视怪物15%减伤\n\n-根据自身九宫格范围内的3级装备获得伤害提升，每多一个3级装备基础面板伤害提升20%，最多提升100%',
  '超载': '-出现弹射行为时，会在弹射方形成一次基于自身伤害100%+10%（ms）攻速的磁暴伤害，每次触发后存在3秒的冷却\n\n-进行两次弹射行为后，降低中间单位（A→B→C中的B）15%的减伤，持续30s（注释：降低15%的减伤主要作用于其他装置对该单位的伤害，同时存在的隐藏设定是超载buff第一条提到了磁暴伤害，但这个中间单位的磁暴伤害在触发的时候是不会吃到这个buff的，可以理解成挂上了一个不对电弧生效，对其他装置生效的一个独立15%减伤降低，同时考虑到抑制剂的减伤叠加，这个算作乘区，不能相加）\n\n-当场上的怪物数量不少于1个时，每次电弧造成伤害时额外造成一次当前怪物生命值2%的真实伤害（不参与怪物减伤计算）\n\n-当场上的怪物为1个时，攻击会在怪物身上独立弹射2次（A→B→C的这种），同时每造成3次电弧伤害附加2次当前怪物生命值5%的真实伤害',
};

// 各装置的前端样式（目录：LvX + 拥有/移除/获得 + buff 名）
const TOWER_BUFF_DIR = {
  archer: [
    { level: 'Lv2', items: [{ verb: 'have', buffs: ['淬火'] }] },
    { level: 'Lv3', items: [{ verb: 'have', buffs: ['淬火', '锈蚀', '链式反应'] }] },
  ],
  cannon: [
    { level: 'Lv3', items: [{ verb: 'have', buffs: ['云端服务', '追击模式'] }] },
  ],
  ice: [
    { level: 'Lv2', items: [{ verb: 'have', buffs: ['冻伤', '破甲'] }] },
    { level: 'Lv3', items: [{ verb: 'remove', buffs: ['冻伤', '破甲'] }, { verb: 'get', buffs: ['低温日'] }] },
  ],
  magic: [
    { level: 'Lv1', items: [{ verb: 'have', buffs: ['弹射'] }] },
    { level: 'Lv2', items: [{ verb: 'have', buffs: ['弹射', '满载'] }] },
    { level: 'Lv3', items: [{ verb: 'have', buffs: ['弹射', '满载', '超载'] }] },
  ],
};

// ==================== UI管理器 ====================
const UI = {
  init() {
    // 主菜单
    $('#btn-new-game').addEventListener('click', () => this.startNewGame());
    $('#btn-continue').addEventListener('click', () => this.continueGame());
    $('#btn-settings').addEventListener('click', () => this.showSettings(true));
    $('#btn-settings-close').addEventListener('click', () => this.showSettings(false));

    // 暂停菜单
    $('#btn-resume').addEventListener('click', () => { Input.resumeGame(); });
    $('#btn-save-pause').addEventListener('click', () => { SaveManager.save(); });
    $('#btn-quit').addEventListener('click', () => { this.backToMenu(); });

    // 游戏结束
    $('#btn-restart').addEventListener('click', () => { this.startNewGame(); });
    $('#btn-menu-from-over').addEventListener('click', () => { this.backToMenu(); });

    // 升级弹窗按钮
    $('#btn-upgrade-close').addEventListener('click', () => this.hideUpgradePopup());
    $('#overlay-upgrade').addEventListener('click', (e) => {
      // 点击背景（非弹窗内容）关闭
      if (e.target.id === 'overlay-upgrade') this.hideUpgradePopup();
    });
    $('#btn-upgrade-popup').addEventListener('click', () => {
      if (Input.selectedTower && GameState.state === 'PLAYING') {
        const t = Input.selectedTower;
        if (t.level < 2) {
          const cost = t.typeDef.upgradeCosts[t.level];
          if (Economy.gold < cost) {
            this.hideUpgradePopup();
            this.showUpgradeHint('金币不足');
            return;
          }
        }
        TowerSystem.upgrade(t);
        Stats.towersUpgraded++;
        this.hideUpgradePopup();
      }
    });
    $('#btn-sell-popup').addEventListener('click', () => {
      if (Input.selectedTower && GameState.state === 'PLAYING') {
        TowerSystem.sell(Input.selectedTower);
        Stats.towersSold++;
        Input.selectedTower = null;
        this.hideUpgradePopup();
      }
    });

    // 侧边栏按钮
    $('#btn-start-wave').addEventListener('click', () => {
      if (GameState.state === 'PLAYING' && !WaveManager.waveActive) {
        WaveManager.startWave();
        UI.updateAll();
      }
    });
    $('#btn-pause').addEventListener('click', () => {
      if (GameState.state === 'PLAYING') Input.pauseGame();
      else if (GameState.state === 'PAUSED') Input.resumeGame();
    });
    // 重置当前波次
    $('#btn-restart-wave').addEventListener('click', () => {
      WaveManager.restartCurrentWave();
    });
    $('#btn-save').addEventListener('click', () => { SaveManager.save(); });
    $('#btn-menu').addEventListener('click', () => { this.backToMenu(); });
    $('#btn-speed').addEventListener('click', () => { GameLoop.toggleSpeed(); });

    // 升级/出售
    $('#btn-upgrade').addEventListener('click', () => {
      if (Input.selectedTower && GameState.state === 'PLAYING') {
        const t = Input.selectedTower;
        if (t.level < 2) {
          const cost = t.typeDef.upgradeCosts[t.level];
          if (Economy.gold < cost) {
            this.showUpgradeHint();
            return;
          }
        }
        TowerSystem.upgrade(t);
        Stats.towersUpgraded++;
        this.updateAll();
      }
    });
    $('#btn-sell').addEventListener('click', () => {
      if (Input.selectedTower && GameState.state === 'PLAYING') {
        TowerSystem.sell(Input.selectedTower);
        Stats.towersSold++;
        Input.selectedTower = null;
        this.updateAll();
      }
    });

    // 矩阵追击模式开关（最多2个矩阵可开启追击）
    $('#btn-pursuit').addEventListener('click', () => {
      const t = Input.selectedTower;
      if (t && t.type === 'cannon' && t.level >= 2 && GameState.state === 'PLAYING') {
        if (!t.pursuitMode) {
          const activePursuit = TowerSystem.towers.filter(x => x.type === 'cannon' && x.pursuitMode).length;
          if (activePursuit >= 2) {
            this.showToast('最多2个矩阵可开启追击');
            return;
          }
        }
        t.pursuitMode = !t.pursuitMode;
        TestLog.info('TOWER', `矩阵 #${t.id} 追击模式 ${t.pursuitMode ? '开启' : '关闭'}`);
        this.updateAll();
      }
    });

    // 设置
    $('#vol-slider').addEventListener('input', (e) => {
      Settings.setVolume(parseInt(e.target.value));
      $('#vol-label').textContent = Settings.volume + '%';
    });
    $('#difficulty-select').addEventListener('change', (e) => {
      Settings.setDifficulty(e.target.value);
    });

    // 初始化塔按钮
    this.createTowerButtons();

    // tooltip hover 保持：鼠标移到 tooltip 上时不消失，移开才延迟隐藏
    $('#tower-tooltip').addEventListener('mouseenter', () => {
      clearTimeout(this._tooltipHideTimer);
    });
    $('#tower-tooltip').addEventListener('mouseleave', () => {
      this.scheduleHideTooltip();
    });

    // 加载设置
    Settings.init();
    $('#vol-slider').value = Settings.volume;
    $('#vol-label').textContent = Settings.volume + '%';
    $('#difficulty-select').value = Settings.difficulty;

    // 初始化存档按钮状态
    this.updateContinueButton();
  },

  createTowerButtons() {
    const container = $('#tower-buttons');
    container.innerHTML = '';

    for (const [id, def] of Object.entries(CONFIG.TOWER_TYPES)) {
      const btn = document.createElement('button');
      btn.className = 'tower-btn';
      btn.id = `tower-btn-${id}`;
      // 实时计算当前数量（占位渲染时初值，后续由 updateTowerCounts 刷新）
      const currentCount = TowerSystem.towers.filter(t => t.type === id).length;
      btn.innerHTML = `
        <span class="tower-icon">${def.icon}</span>
        <span class="tower-info">
          <span class="tower-name">${def.name}</span>
          <span class="tower-cost">${def.cost}金币</span>
          <br><span class="tower-desc">${def.desc}</span>
        </span>
        <span class="tower-count">${currentCount}/6</span>
      `;
      btn.addEventListener('click', () => {
        if (GameState.state === 'PLAYING') {
          Input.placingType = id;
          Input.selectedTower = null;
          this.updateAll();
          TestLog.info('UI', `选择放置 ${def.name}`);
        }
      });
      // hover 预览：弹出强化目录（buff 名蓝色下划线，可继续 hover 查看详情）
      btn.addEventListener('mouseenter', () => {
        clearTimeout(this._tooltipHideTimer);
        this.showBuffDir(id, def, btn);
      });
      btn.addEventListener('mouseleave', () => {
        this.scheduleHideTooltip();
      });
      container.appendChild(btn);
    }
  },

  // 渲染某等级的 buff 目录（LvX + 拥有/移除/获得 + buff 名）
  renderBuffDirLevel(lv) {
    const itemsHtml = lv.items.map(item => {
      const verb = BUFF_VERB_TEXT[item.verb];
      const buffsHtml = item.buffs.map(b => `<span class="tt-buffname" data-buff="${b}">【${b}】</span>`).join('、');
      return `<span class="tt-verb">${verb}</span> ${buffsHtml}`;
    }).join('<span class="tt-verb">，</span>');
    return `<div class="tt-level"><span class="tt-verb">${lv.level}</span> ${itemsHtml}</div>`;
  },

  // 显示强化目录（第一层 tooltip）
  showBuffDir(id, def, btn) {
    const dir = TOWER_BUFF_DIR[id];
    if (!dir) return;
    const tip = $('#tower-tooltip');
    tip.innerHTML = `
      <div class="tt-title">${def.icon} ${def.name} · 强化预览</div>
      ${dir.map(lv => this.renderBuffDirLevel(lv)).join('')}
    `;
    tip.style.display = 'block';
    const rect = btn.getBoundingClientRect();
    tip.style.left = Math.max(8, rect.left - 372) + 'px';
    tip.style.top = Math.min(rect.top, window.innerHeight - 180) + 'px';

    // 给每个 buff 名绑定 hover：显示详情浮窗
    tip.querySelectorAll('.tt-buffname').forEach(el => {
      el.addEventListener('mouseenter', () => this.showBuffDetail(el.dataset.buff, el));
      el.addEventListener('mouseleave', () => this.hideBuffDetail());
    });
  },

  // 显示 buff 词条详情（第二层浮窗）
  showBuffDetail(buffName, anchorEl) {
    const detail = BUFF_DETAILS[buffName];
    if (!detail) return;
    const tip = $('#buff-detail-tooltip');
    // 把【xxx】包裹的 buff 名整体（含括号）渲染成蓝色
    const html = detail.replace(/【([^】]+)】/g, '<span class="bd-buff">【$1】</span>');
    tip.innerHTML = `<div class="bd-title">【${buffName}】</div>${html}`;
    tip.style.display = 'block';
    const rect = anchorEl.getBoundingClientRect();
    // 悬浮在 buff 名下方，空间不够则放上方
    let left = rect.left;
    if (left + 440 > window.innerWidth) left = window.innerWidth - 440 - 8;
    tip.style.left = Math.max(8, left) + 'px';
    let top = rect.bottom + 6;
    if (top + 300 > window.innerHeight) top = rect.top - 10;
    tip.style.top = top + 'px';
  },

  hideBuffDetail() {
    $('#buff-detail-tooltip').style.display = 'none';
  },

  // 延迟隐藏（给鼠标从塔按钮移到 tooltip 的时间）
  scheduleHideTooltip() {
    clearTimeout(this._tooltipHideTimer);
    this._tooltipHideTimer = setTimeout(() => {
      $('#tower-tooltip').style.display = 'none';
      $('#buff-detail-tooltip').style.display = 'none';
    }, 150);
  },

  showUpgradePopup(tower) {
    const overlay = $('#overlay-upgrade');
    const t = tower;
    const stats = TowerSystem.getStats(t);

    $('#upgrade-tower-icon').textContent = t.typeDef.icon;
    $('#upgrade-tower-name').textContent = t.typeDef.name;
    $('#upgrade-tower-level').textContent = `等级 ${t.level + 1} / 3`;

    const totalCost = t.typeDef.cost +
      (t.level > 0 ? t.typeDef.upgradeCosts[0] : 0) +
      (t.level > 1 ? t.typeDef.upgradeCosts[1] : 0);
    const sellPrice = totalCost;

    let statsHTML = `
      <div>📊 当前属性</div>
      <div style="margin-top:6px;">
        ⚔️ 伤害: <b style="color:#ff6666;">${stats.damage}</b> &nbsp;
        🎯 范围: <b style="color:#66ccff;">${stats.range}</b> &nbsp;
        ⚡ 攻速: <b style="color:#ffdd55;">${(1000/stats.fireRate).toFixed(1)}/s</b>
      </div>
      <div style="margin-top:6px;font-size:11px;color:#88aa66;">
        💰 当前出售: <b style="color:#88ff88;">${sellPrice}金币</b>
      </div>
    `;
    $('#upgrade-stats').innerHTML = statsHTML;

    // 特殊属性
    let specialHTML = '';
    if (stats.aoe) specialHTML += `<div>💥 AOE 范围伤害: <b>${stats.aoe}</b>px</div>`;
    if (stats.slow) specialHTML += `<div>❄️ 减速: <b>${(stats.slow*100).toFixed(0)}%</b> 持续 ${stats.slowDuration/1000}s</div>`;
    if (stats.chain) specialHTML += `<div>⚡ 弹射: <b>${stats.chain}</b> 目标（每跳70%）</div>`;
    // 钉枪 buff
    if (t.type === 'archer' && t.level >= 1) {
      specialHTML += `<div style="margin-top:6px;color:#88dd88;">🔫 <b>淬火:</b> 连续命中+10%攻速+10伤（叠${t.level >= 2 ? 3 : 2}层）；未命中下一击+50%攻速</div>`;
    }
    if (t.type === 'archer' && t.level >= 2) {
      specialHTML += `<div style="color:#88dd88;">🔫 <b>锈蚀:</b> 命中5次叠1层（队友承伤+5%/层封顶3层）；叠满后每8次命中链式反应</div>`;
    }
    // 矩阵 buff
    if (t.type === 'cannon' && t.level >= 2) {
      specialHTML += `<div style="margin-top:6px;color:#ffaa66;">💥 <b>云端服务:</b> 九宫格内+30%伤害+30范围+20%攻速；追击120（每受击2次，0.6s冷却）</div>`;
    }
    // 液氮 buff
    if (t.type === 'ice' && t.level >= 1) {
      specialHTML += `<div style="margin-top:6px;color:#88ccff;">🧊 <b>冻伤:</b> 减速15%/层叠3层→冻结1.5s+破甲20%/层（最多60%）</div>`;
    }
    if (t.type === 'ice' && t.level >= 2) {
      specialHTML += `<div style="color:#88ccff;">🧊 <b>低温日:</b> 失去冻伤，混合伤害（伤害×200%+当前生命3%）</div>`;
    }
    // 电弧 buff
    if (t.type === 'magic' && t.level >= 1) {
      specialHTML += `<div style="margin-top:6px;color:#cc88ff;">⚡ <b>满载:</b> 弹射+5%、无视15%减伤；周边3级装备+20%伤害（最多100%）</div>`;
    }
    if (t.type === 'magic' && t.level >= 2) {
      specialHTML += `<div style="color:#cc88ff;">⚡ <b>超载:</b> 磁暴(3s冷却)+降减伤15%+真伤2%+单怪独立弹射</div>`;
    }
    if (specialHTML) {
      $('#upgrade-special').innerHTML = specialHTML;
      $('#upgrade-special').style.display = 'block';
    } else {
      $('#upgrade-special').style.display = 'none';
    }

    // 升级按钮
    const upgradeBtn = $('#btn-upgrade-popup');
    upgradeBtn.classList.remove('btn-locked', 'btn-poor');
    if (t.level < 2) {
      const cost = t.typeDef.upgradeCosts[t.level];
      const nextStats = t.typeDef.levels[t.level + 1];
      const magicLocked = (t.type === 'magic' && t.level === 1 && !this.isMagicLv3Unlocked());
      if (magicLocked) {
        upgradeBtn.textContent = '🔒 升级 (需2座3级装置)';
        upgradeBtn.disabled = true;
        upgradeBtn.classList.add('btn-locked');
      } else if (GameState.state !== 'PLAYING') {
        upgradeBtn.textContent = `升级 → ${nextStats.damage}伤害 (${cost}金币)`;
        upgradeBtn.disabled = true;
      } else if (Economy.gold < cost) {
        upgradeBtn.textContent = `升级 → ${nextStats.damage}伤害 (${cost}金币)`;
        upgradeBtn.disabled = false;
        upgradeBtn.classList.add('btn-poor');
      } else {
        upgradeBtn.textContent = `升级 → ${nextStats.damage}伤害 (${cost}金币)`;
        upgradeBtn.disabled = false;
      }
    } else {
      upgradeBtn.textContent = '已达最高级';
      upgradeBtn.disabled = true;
    }

    // 出售按钮
    const sellBtn = $('#btn-sell-popup');
    sellBtn.textContent = `出售 (+${sellPrice}金币)`;
    sellBtn.disabled = GameState.state !== 'PLAYING';

    overlay.classList.remove('hidden');
  },

  hideUpgradePopup() {
    $('#overlay-upgrade').classList.add('hidden');
  },

  updateAll() {
    this.updateStats();
    this.updateTowerButtons();
    this.updateTowerInfo();
    this.updateWaveButton();
  },

  updateStats() {
    $('#stat-gold').textContent = Economy.gold;
    const livesEl = $('#stat-lives');
    livesEl.textContent = Lives.lives;
    livesEl.className = 'stat-value' + (Lives.lives <= 5 ? ' danger' : '');
    $('#stat-wave').textContent = `${WaveManager.currentWave}/${WaveManager.totalWaves}`;
    $('#stat-score').textContent = Stats.kills * 10 + Stats.wavesCompleted * 50;
    $('#stat-kills').textContent = Stats.kills;
  },

  updateTowerButtons() {
    for (const [id] of Object.entries(CONFIG.TOWER_TYPES)) {
      const btn = $(`#tower-btn-${id}`);
      if (!btn) continue;
      btn.className = 'tower-btn';
      if (Input.placingType === id) btn.classList.add('selected');
      // 实时刷新 n/2 数量
      const count = TowerSystem.towers.filter(t => t.type === id).length;
      const countEl = btn.querySelector('.tower-count');
      if (countEl) countEl.textContent = `${count}/6`;
    }
  },

  updateTowerInfo() {
    const panel = $('#tower-info-panel');
    const content = $('#tower-info-content');
    const upgradeBtn = $('#btn-upgrade');
    const sellBtn = $('#btn-sell');

    if (!Input.selectedTower) {
      panel.style.display = 'none';
      return;
    }

    panel.style.display = 'block';
    const t = Input.selectedTower;
    const stats = TowerSystem.getStats(t);
    const totalCost = t.typeDef.cost +
      (t.level > 0 ? t.typeDef.upgradeCosts[0] : 0) +
      (t.level > 1 ? t.typeDef.upgradeCosts[1] : 0);
    const sellPrice = totalCost;

    let info = `
      <div style="font-size:14px;font-weight:bold;color:#ffd700;">${t.typeDef.icon} ${t.typeDef.name} Lv.${t.level + 1}</div>
      <div style="font-size:11px;color:#888;margin:4px 0;">
        伤害: ${stats.damage} | 范围: ${stats.range} | 攻速: ${(1000/stats.fireRate).toFixed(1)}/s
      </div>
    `;

    if (stats.aoe) info += `<div style="font-size:11px;color:#8af;">AOE范围: ${stats.aoe}</div>`;
    if (stats.slow) info += `<div style="font-size:11px;color:#8cf;">减速: ${(stats.slow*100).toFixed(0)}%</div>`;
    if (stats.chain) info += `<div style="font-size:11px;color:#c8f;">连锁: ${stats.chain}目标</div>`;
    // 电弧3级升级限制提示（Lv2→Lv3 未解锁时）
    if (t.type === 'magic' && t.level === 1) {
      const lv3Unlocked = this.isMagicLv3Unlocked();
      info += `<div style="font-size:11px;color:${lv3Unlocked ? '#8f8' : '#f88'};">⚡ 升级限制：场上需存在 3 级装置 × 2</div>`;
    }

    content.innerHTML = info;

    // 升级按钮
    upgradeBtn.classList.remove('btn-locked', 'btn-poor');
    if (t.level < 2) {
      const cost = t.typeDef.upgradeCosts[t.level];
      // 电弧3级解锁限制
      const magicLocked = (t.type === 'magic' && t.level === 1 && !this.isMagicLv3Unlocked());
      upgradeBtn.style.display = 'block';
      if (magicLocked) {
        upgradeBtn.textContent = '🔒 升级 (需2座3级装置)';
        upgradeBtn.disabled = true;
        upgradeBtn.classList.add('btn-locked');
      } else if (GameState.state !== 'PLAYING') {
        upgradeBtn.textContent = `升级 (${cost}金币)`;
        upgradeBtn.disabled = true;
      } else if (Economy.gold < cost) {
        // 金币不足：保持可点击，点击时弹"金币不足"提示
        upgradeBtn.textContent = `升级 (${cost}金币)`;
        upgradeBtn.disabled = false;
        upgradeBtn.classList.add('btn-poor');
      } else {
        upgradeBtn.textContent = `升级 (${cost}金币)`;
        upgradeBtn.disabled = false;
      }
    } else {
      upgradeBtn.style.display = 'block';
      upgradeBtn.textContent = '已达最高级';
      upgradeBtn.disabled = true;
    }

    // 出售按钮
    sellBtn.textContent = `出售 (${sellPrice}金币)`;
    sellBtn.disabled = GameState.state !== 'PLAYING';

    // 追击开关（矩阵Lv3专属）
    const pursuitBtn = $('#btn-pursuit');
    if (t.type === 'cannon' && t.level >= 2) {
      pursuitBtn.style.display = 'block';
      pursuitBtn.textContent = `追击模式：${t.pursuitMode ? '开' : '关'}`;
      pursuitBtn.className = 'btn ' + (t.pursuitMode ? 'btn-warning' : 'btn-secondary');
      pursuitBtn.disabled = GameState.state !== 'PLAYING';
    } else {
      pursuitBtn.style.display = 'none';
    }
  },

  updateWaveButton() {
    const btn = $('#btn-start-wave');
    if (!WaveManager.waveActive && WaveManager.currentWave < WaveManager.totalWaves && GameState.state === 'PLAYING') {
      btn.disabled = false;
      btn.textContent = `开始第 ${WaveManager.currentWave + 1} 波`;
    } else if (WaveManager.waveActive) {
      btn.disabled = true;
      btn.textContent = `第 ${WaveManager.currentWave} 波进行中...`;
    } else if (WaveManager.currentWave >= WaveManager.totalWaves) {
      btn.disabled = true;
      btn.textContent = '全部波次完成';
    } else {
      btn.disabled = true;
      btn.textContent = '开始下一波';
    }
  },

  // 检查电弧3级解锁条件：2座不同种类的3级塔
  isMagicLv3Unlocked() {
    const lv3Types = new Set();
    for (const t of TowerSystem.towers) {
      if (t.level === 2 && t.type !== 'magic') lv3Types.add(t.type);
    }
    return lv3Types.size >= 2;
  },

  // 重启"金币不足/禁止"向上丝滑提示动画
  showUpgradeHint(msg) {
    const text = msg || '金币不足';
    const hint = $('#upgrade-hint-side');
    const btn = $('#btn-upgrade');
    const panel = $('#tower-info-panel');
    if (!hint || !btn || !panel) return;
    hint.textContent = text;
    // 定位到升级按钮正上方
    const btnRect = btn.getBoundingClientRect();
    const panelRect = panel.getBoundingClientRect();
    hint.style.top = (btnRect.top - panelRect.top - 32) + 'px';
    hint.classList.remove('show');
    // 重启动画
    hint.style.animation = 'none';
    hint.offsetHeight; // 强制 reflow
    hint.style.animation = '';
    hint.classList.add('show');
    // 1.8s 后自动隐藏
    clearTimeout(this._hintTimer);
    this._hintTimer = setTimeout(() => hint.classList.remove('show'), 1800);
  },

  updateSpeedButton() {
    const btn = $('#btn-speed');
    if (btn) {
      btn.textContent = `倍速 ${GameLoop.gameSpeed}x (F)`;
    }
  },

  updateContinueButton() {
    const btn = $('#btn-continue');
    if (SaveManager.hasSave()) {
      btn.classList.remove('hidden');
    } else {
      btn.classList.add('hidden');
    }
  },

  startNewGame() {
    // 完全重置
    GameState.reset();
    GameState.transition('PLAYING');

    MapSystem.init();
    TowerSystem.reset();
    ProjectileSystem.reset();
    EnemySystem.reset();
    WaveManager.init();
    BuffSystem.reset();
    Economy.init(CONFIG.START_GOLD);
    Lives.init(CONFIG.START_LIVES);
    Stats.init();
    AchievementSystem.reset();

    Input.selectedTower = null;
    Input.placingType = null;

    // 加载设置中的难度
    Settings.init();

    // 保存初始快照（第一波"重置"时回滚到此）
    WaveManager.saveSnapshot();

    this.hideAllOverlays();
    this.updateAll();

    // 播放背景音乐（点击"新游戏"属于用户交互，可触发自动播放）
    const bgm = $('#bgm');
    if (bgm) { bgm.volume = 0.5; const p = bgm.play(); if (p && p.catch) p.catch(() => {}); }

    TestLog.info('GAME', '新游戏开始');
  },

  continueGame() {
    MapSystem.init();
    if (SaveManager.load()) {
      // 读档成功后保存快照（作为"重置当前波次"的回滚基准）
      WaveManager.saveSnapshot();
      this.hideAllOverlays();
      this.updateAll();
      // 播放背景音乐
      const bgm = $('#bgm');
      if (bgm) { bgm.volume = 0.5; const p = bgm.play(); if (p && p.catch) p.catch(() => {}); }
      if (GameState.state === 'PAUSED') {
        Input.resumeGame();
      }
    } else {
      this.startNewGame();
    }
  },

  backToMenu() {
    // 返回菜单前自动保存当前进度（游戏进行中/暂停中，且有实际进度时）
    if ((GameState.state === 'PLAYING' || GameState.state === 'PAUSED') && WaveManager.currentWave > 0) {
      SaveManager.save();
    }

    GameState.reset();
    GameState.transition('MENU');
    this.hideAllOverlays();
    this.showMenu(true);
    this.updateContinueButton();
    TestLog.info('GAME', '返回主菜单');
  },

  showMenu(show) {
    if (show) $('#overlay-menu').classList.remove('hidden');
    else $('#overlay-menu').classList.add('hidden');
  },

  showSettings(show) {
    if (show) $('#overlay-settings').classList.remove('hidden');
    else $('#overlay-settings').classList.add('hidden');
  },

  showPause(show) {
    if (show) $('#overlay-pause').classList.remove('hidden');
    else $('#overlay-pause').classList.add('hidden');
  },

  showGameOver(victory) {
    const overlay = $('#overlay-gameover');
    const title = $('#gameover-title');
    const statsDiv = $('#gameover-stats');

    if (victory) {
      title.textContent = '胜利！';
      title.style.color = '#ffd700';
    } else {
      title.textContent = '游戏结束';
      title.style.color = '#ff5555';
    }

    const elapsed = Stats.getElapsedTime();
    const mins = Math.floor(elapsed / 60);
    const secs = elapsed % 60;

    statsDiv.innerHTML = `
      <div class="stat-row"><span class="stat-label">用时</span><span class="stat-value">${mins}分${secs}秒</span></div>
      <div class="stat-row"><span class="stat-label">波次</span><span class="stat-value">${WaveManager.currentWave}/${WaveManager.totalWaves}</span></div>
      <div class="stat-row"><span class="stat-label">击杀</span><span class="stat-value">${Stats.kills}</span></div>
      <div class="stat-row"><span class="stat-label">剩余生命</span><span class="stat-value">${Lives.lives}</span></div>
      <div class="stat-row"><span class="stat-label">剩余金币</span><span class="stat-value">${Economy.gold}</span></div>
      <div class="stat-row"><span class="stat-label">放置塔数</span><span class="stat-value">${Stats.towersPlaced}</span></div>
      <div class="stat-row"><span class="stat-label">成就</span><span class="stat-value">${AchievementSystem.getUnlocked().length}/8</span></div>
    `;

    overlay.classList.remove('hidden');

    // 如果是胜利，删除存档
    if (victory) SaveManager.delete();
  },

  hideAllOverlays() {
    $('#overlay-menu').classList.add('hidden');
    $('#overlay-settings').classList.add('hidden');
    $('#overlay-pause').classList.add('hidden');
    $('#overlay-gameover').classList.add('hidden');
  },

  showToast(msg) {
    const container = $('#toast-container');
    const toast = document.createElement('div');
    toast.className = 'toast';
    toast.textContent = msg;
    container.appendChild(toast);

    setTimeout(() => {
      if (toast.parentNode) toast.parentNode.removeChild(toast);
    }, 3000);
  }
};

// ==================== 渲染器 ====================
const Renderer = {
  canvas: null,
  ctx: null,

  init() {
    this.canvas = $('#game-canvas');
    this.ctx = this.canvas.getContext('2d');
  },

  render() {
    if (GameState.state === 'MENU') return;

    const ctx = this.ctx;
    const w = CONFIG.CANVAS_W;
    const h = CONFIG.CANVAS_H;

    // 清屏
    ctx.fillStyle = '#0a1428';
    ctx.fillRect(0, 0, w, h);

    this.drawLabBackground();
    this.drawGrid();
    this.drawPath();
    this.drawLabDecorations();
    this.drawTowers();
    this.drawTowerRanges();
    this.drawEnemies();
    this.drawProjectiles();
    this.drawPlacementPreview();
    this.drawSelectionHighlight();

    // 游戏结束/胜利时不画HUD
    if (GameState.state !== 'GAME_OVER' && GameState.state !== 'VICTORY') {
      this.drawHUD();
    }
  },

  drawGrid() {
    const ctx = this.ctx;
    for (let r = 0; r < CONFIG.GRID_ROWS; r++) {
      for (let c = 0; c < CONFIG.GRID_COLS; c++) {
        const x = c * CONFIG.TILE_SIZE;
        const y = r * CONFIG.TILE_SIZE;

        if (MapSystem.isPath(c, r)) {
          // 金属通道（走廊）：锈银+反光
          ctx.fillStyle = '#1a2540';
          ctx.fillRect(x + 1, y + 1, CONFIG.TILE_SIZE - 2, CONFIG.TILE_SIZE - 2);
          // 金属高光
          ctx.fillStyle = 'rgba(120,180,220,0.15)';
          ctx.fillRect(x + 2, y + 2, CONFIG.TILE_SIZE - 4, 4);
        } else {
          // 地板：透明蓝金属板
          ctx.fillStyle = '#0d1a2e';
          ctx.fillRect(x + 1, y + 1, CONFIG.TILE_SIZE - 2, CONFIG.TILE_SIZE - 2);
          // 金属板纹理
          ctx.fillStyle = 'rgba(80,140,200,0.08)';
          ctx.fillRect(x + 2, y + 2, CONFIG.TILE_SIZE - 4, 2);
          ctx.fillRect(x + 2, y + CONFIG.TILE_SIZE - 4, CONFIG.TILE_SIZE - 4, 2);
        }

        // 网格线（科技风：蓝色细线）
        ctx.strokeStyle = 'rgba(80,140,200,0.25)';
        ctx.lineWidth = 1;
        ctx.strokeRect(x + 0.5, y + 0.5, CONFIG.TILE_SIZE - 1, CONFIG.TILE_SIZE - 1);

        // 角落装饰：科技铆钉
        if ((c + r) % 2 === 0 && !MapSystem.isPath(c, r)) {
          ctx.fillStyle = 'rgba(120,180,220,0.3)';
          ctx.beginPath();
          ctx.arc(x + 4, y + 4, 1, 0, Math.PI * 2);
          ctx.fill();
          ctx.beginPath();
          ctx.arc(x + CONFIG.TILE_SIZE - 4, y + CONFIG.TILE_SIZE - 4, 1, 0, Math.PI * 2);
          ctx.fill();
        }
      }
    }
  },

  // 实验室大背景：微弱电路网格
  drawLabBackground() {
    const ctx = this.ctx;
    // 透明蓝色大格子背景纹理
    ctx.strokeStyle = 'rgba(80,140,200,0.06)';
    ctx.lineWidth = 1;
    for (let i = 0; i < CONFIG.CANVAS_W; i += 80) {
      ctx.beginPath();
      ctx.moveTo(i, 0);
      ctx.lineTo(i, CONFIG.CANVAS_H);
      ctx.stroke();
    }
    for (let j = 0; j < CONFIG.CANVAS_H; j += 80) {
      ctx.beginPath();
      ctx.moveTo(0, j);
      ctx.lineTo(CONFIG.CANVAS_W, j);
      ctx.stroke();
    }
    // 顶部光带
    const grad = ctx.createLinearGradient(0, 0, 0, 100);
    grad.addColorStop(0, 'rgba(100,180,240,0.1)');
    grad.addColorStop(1, 'rgba(100,180,240,0)');
    ctx.fillStyle = grad;
    ctx.fillRect(0, 0, CONFIG.CANVAS_W, 100);
  },

  // 实验室装饰：破碎试管、电路、警告标识
  drawLabDecorations() {
    const ctx = this.ctx;
    // 一些固定的装饰元素位置（手工布置，不重复）
    const decos = [
      { x: 100, y: 80, type: 'testtube', angle: 0.3 },
      { x: 240, y: 130, type: 'testtube', angle: -0.5 },
      { x: 380, y: 80, type: 'testtube', angle: 0.7 },
      { x: 540, y: 120, type: 'circuit' },
      { x: 700, y: 80, type: 'warning' },
      { x: 700, y: 200, type: 'testtube', angle: -0.2 },
      { x: 60, y: 200, type: 'circuit' },
      { x: 80, y: 350, type: 'testtube', angle: 0.5 },
      { x: 720, y: 350, type: 'testtube', angle: -0.6 },
      { x: 720, y: 480, type: 'warning' },
      { x: 60, y: 480, type: 'circuit' },
      { x: 380, y: 540, type: 'testtube', angle: 0.4 },
    ];

    for (const d of decos) {
      // 跳过装饰位置上已放置塔的格子（不渲染）
      const gx = Math.floor(d.x / CONFIG.TILE_SIZE);
      const gy = Math.floor(d.y / CONFIG.TILE_SIZE);
      if (MapSystem.grid[gy]?.[gx]?.tower) continue;

      ctx.save();
      ctx.translate(d.x, d.y);
      if (d.angle) ctx.rotate(d.angle);

      if (d.type === 'testtube') {
        // 破碎试管
        ctx.fillStyle = 'rgba(180,200,220,0.25)';
        ctx.fillRect(-3, -12, 6, 24);
        // 试管口
        ctx.fillStyle = 'rgba(220,230,240,0.4)';
        ctx.fillRect(-4, -14, 8, 3);
        // 试管液
        ctx.fillStyle = 'rgba(100,220,180,0.4)';
        ctx.fillRect(-3, 0, 6, 12);
        // 破碎裂纹
        ctx.strokeStyle = 'rgba(255,255,255,0.3)';
        ctx.lineWidth = 0.5;
        ctx.beginPath();
        ctx.moveTo(-2, -8);
        ctx.lineTo(1, -2);
        ctx.lineTo(-3, 4);
        ctx.stroke();
        // 试管边缘高光
        ctx.strokeStyle = 'rgba(220,240,255,0.5)';
        ctx.lineWidth = 0.8;
        ctx.strokeRect(-3, -12, 6, 24);
      } else if (d.type === 'circuit') {
        // 电路板
        ctx.fillStyle = 'rgba(60,90,140,0.4)';
        ctx.fillRect(-10, -8, 20, 16);
        ctx.fillStyle = 'rgba(100,180,240,0.3)';
        ctx.fillRect(-8, -6, 16, 12);
        // 电路纹路
        ctx.strokeStyle = 'rgba(140,200,255,0.5)';
        ctx.lineWidth = 0.8;
        ctx.beginPath();
        ctx.moveTo(-8, 0);
        ctx.lineTo(8, 0);
        ctx.moveTo(0, -6);
        ctx.lineTo(0, 6);
        ctx.stroke();
        // LED指示灯
        ctx.fillStyle = '#88ff88';
        ctx.beginPath();
        ctx.arc(5, -3, 1.5, 0, Math.PI * 2);
        ctx.fill();
      } else if (d.type === 'warning') {
        // 警告三角
        ctx.fillStyle = 'rgba(255,200,80,0.5)';
        ctx.beginPath();
        ctx.moveTo(0, -12);
        ctx.lineTo(12, 10);
        ctx.lineTo(-12, 10);
        ctx.closePath();
        ctx.fill();
        ctx.strokeStyle = 'rgba(255,255,200,0.7)';
        ctx.lineWidth = 1;
        ctx.stroke();
        ctx.fillStyle = '#000';
        ctx.font = 'bold 14px sans-serif';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText('!', 0, 2);
      }
      ctx.restore();
    }
  },

  drawPath() {
    const ctx = this.ctx;
    // 入口（敌人生成点）：红色（危险）
    const s = MapSystem.startPos;
    const pulseR = Math.sin(performance.now() / 400) * 0.15 + 0.85;
    ctx.fillStyle = `rgba(255,60,60,${pulseR})`;
    ctx.beginPath();
    ctx.arc(s.x * CONFIG.TILE_SIZE + CONFIG.TILE_SIZE/2,
           s.y * CONFIG.TILE_SIZE + CONFIG.TILE_SIZE/2, 14, 0, Math.PI*2);
    ctx.fill();
    ctx.strokeStyle = '#ffaaaa';
    ctx.lineWidth = 2;
    ctx.stroke();

    // 出口（核心）：绿色（要保护的）
    const e = MapSystem.endPos;
    const pulseG = Math.sin(performance.now() / 400 + Math.PI) * 0.15 + 0.85;
    ctx.fillStyle = `rgba(60,255,120,${pulseG})`;
    ctx.beginPath();
    ctx.arc(e.x * CONFIG.TILE_SIZE + CONFIG.TILE_SIZE/2,
           e.y * CONFIG.TILE_SIZE + CONFIG.TILE_SIZE/2, 14, 0, Math.PI*2);
    ctx.fill();
    ctx.strokeStyle = '#aaffcc';
    ctx.lineWidth = 2;
    ctx.stroke();
  },

  drawTowers() {
    const ctx = this.ctx;
    for (const t of TowerSystem.towers) {
      // 拖动中的塔用 dragX/dragY（跟随鼠标），否则用格子中心
      const cx = t.dragging ? t.dragX : (t.col * CONFIG.TILE_SIZE + CONFIG.TILE_SIZE / 2);
      const cy = t.dragging ? t.dragY : (t.row * CONFIG.TILE_SIZE + CONFIG.TILE_SIZE / 2);
      const isHover = (t === Input.hoverTower);
      const isSelected = (t === Input.selectedTower);

      // 悬停/选中高亮（脉冲动画）
      if (isHover || isSelected) {
        const pulse = Math.sin(performance.now() / 200) * 0.3 + 0.7;
        const color = isSelected ? 'rgba(255,215,0,' : 'rgba(255,255,255,';
        ctx.strokeStyle = color + pulse + ')';
        ctx.lineWidth = 3;
        ctx.beginPath();
        ctx.arc(cx, cy, 20, 0, Math.PI * 2);
        ctx.stroke();
        // 提示文字
        ctx.fillStyle = isSelected ? '#ffd700' : '#fff';
        ctx.font = 'bold 10px sans-serif';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'bottom';
        ctx.fillText('右键升级', cx, cy - 22);
      }

      // 底座
      ctx.fillStyle = t.typeDef.levels[t.level].color;
      ctx.beginPath();
      ctx.arc(cx, cy, 14, 0, Math.PI * 2);
      ctx.fill();

      // 边框
      ctx.strokeStyle = 'rgba(255,255,255,0.3)';
      ctx.lineWidth = 2;
      ctx.stroke();

      // 图标
      ctx.fillStyle = '#fff';
      ctx.font = '16px sans-serif';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText(t.typeDef.icon, cx, cy);

      // 等级标记
      if (t.level > 0) {
        ctx.fillStyle = '#ffd700';
        ctx.font = '8px sans-serif';
        for (let i = 0; i < t.level; i++) {
          ctx.fillText('★', cx - 8 + i * 8, cy - 18);
        }
      }

      // 攻击线（目标已死亡或已漏怪到达出口时不画，避免线残留指向出口）
      if (t.target && !t.target.dead && !t.target.reached) {
        ctx.strokeStyle = t.typeDef.projectileColor;
        ctx.globalAlpha = 0.7;
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.moveTo(cx, cy);
        ctx.lineTo(t.target.x, t.target.y);
        ctx.stroke();
        ctx.globalAlpha = 1;
      }

      // 攻击闪光效果
      const timeSinceFire = GameLoop.gameTime - t.lastFireTime;
      if (t.target && timeSinceFire < 150) {
        const flashAlpha = 1 - timeSinceFire / 150;
        ctx.fillStyle = 'rgba(255,255,255,' + (flashAlpha * 0.6) + ')';
        ctx.beginPath();
        ctx.arc(cx, cy, 18, 0, Math.PI * 2);
        ctx.fill();
      }
    }
  },

  drawTowerRanges() {
    if (!Input.selectedTower) return;
    const ctx = this.ctx;
    const t = Input.selectedTower;
    const stats = TowerSystem.getStats(t);
    const cx = t.col * CONFIG.TILE_SIZE + CONFIG.TILE_SIZE / 2;
    const cy = t.row * CONFIG.TILE_SIZE + CONFIG.TILE_SIZE / 2;

    ctx.strokeStyle = 'rgba(255,255,255,0.3)';
    ctx.lineWidth = 1;
    ctx.setLineDash([5, 5]);
    ctx.beginPath();
    ctx.arc(cx, cy, stats.range, 0, Math.PI * 2);
    ctx.stroke();
    ctx.setLineDash([]);
  },

  drawEnemies() {
    const ctx = this.ctx;
    for (const enemy of EnemySystem.enemies) {
      if (enemy.dead || enemy.reached) continue;

      // 减速特效（基础减速/冻伤/冻结任一存在时显示）
      const isSlowed = (enemy.baseSlowUntil > GameLoop.gameTime) || enemy.freezeStacks > 0 || enemy.frozen;
      if (isSlowed) {
        const alpha = enemy.frozen ? 0.6 : 0.3;
        ctx.fillStyle = `rgba(100,180,255,${alpha})`;
        ctx.beginPath();
        ctx.arc(enemy.x, enemy.y, enemy.size + 4, 0, Math.PI * 2);
        ctx.fill();
      }

      // Boss光环
      if (enemy.isBoss) {
        const pulse = Math.sin(performance.now() / 200) * 0.3 + 0.7;
        ctx.strokeStyle = `rgba(255,50,50,${pulse})`;
        ctx.lineWidth = 3;
        ctx.beginPath();
        ctx.arc(enemy.x, enemy.y, enemy.size + 8, 0, Math.PI * 2);
        ctx.stroke();
      }

      // 巨人光环（可分裂的敌人）
      if (enemy.typeDef?.isGiant) {
        const pulse = Math.sin(performance.now() / 300) * 0.3 + 0.7;
        ctx.strokeStyle = `rgba(200,140,50,${pulse})`;
        ctx.lineWidth = 4;
        ctx.setLineDash([4, 4]);
        ctx.beginPath();
        ctx.arc(enemy.x, enemy.y, enemy.size + 10, 0, Math.PI * 2);
        ctx.stroke();
        ctx.setLineDash([]);
      }

      // 次数盾显示（护盾光环 + 层数）
      if (enemy.shieldStacks > 0) {
        const pulse = Math.sin(performance.now() / 150) * 0.2 + 0.8;
        ctx.strokeStyle = `rgba(100,220,255,${pulse})`;
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.arc(enemy.x, enemy.y, enemy.size + 5, 0, Math.PI * 2);
        ctx.stroke();
        // 层数
        ctx.fillStyle = '#66ddff';
        ctx.font = 'bold 10px sans-serif';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText(`${enemy.shieldStacks}`, enemy.x, enemy.y - enemy.size - 10);
      }

      // 重甲怪护甲光环（减伤，破甲后变淡）
      if (enemy.armor > 0) {
        const eff = Combat.getEffectiveArmor(enemy);
        const alpha = eff > 0.05 ? 0.9 : 0.35;
        ctx.strokeStyle = `rgba(190,190,215,${alpha})`;
        ctx.lineWidth = 3;
        ctx.beginPath();
        ctx.arc(enemy.x, enemy.y, enemy.size + 2, 0, Math.PI * 2);
        ctx.stroke();
      }

      // 根据体型选择绘制
      if (enemy.size <= 8) {
        this.drawMiniSlime(enemy);
      } else if (enemy.typeDef?.isGiant) {
        this.drawGiantMech(enemy);
      } else {
        this.drawRegularSlime(enemy);
      }

      // 血条
      if (enemy.hp < enemy.maxHp || enemy.isBoss || enemy.typeDef?.isGiant) {
        const barWidth = enemy.size * 2;
        const barHeight = 4;
        const barX = enemy.x - barWidth / 2;
        const barY = enemy.y - enemy.size - 8;

        ctx.fillStyle = '#333';
        ctx.fillRect(barX, barY, barWidth, barHeight);

        const hpRatio = enemy.hp / enemy.maxHp;
        const hpColor = hpRatio > 0.5 ? '#55cc55' : hpRatio > 0.25 ? '#cccc55' : '#cc5555';
        ctx.fillStyle = hpColor;
        ctx.fillRect(barX, barY, barWidth * hpRatio, barHeight);
      }
    }
  },

  // 迷你黏液：巨像死亡爆出的最小怪（移速快HP低）
  drawMiniSlime(enemy) {
    const ctx = this.ctx;
    const s = enemy.size;
    // 身体（绿色）
    ctx.fillStyle = '#88cc55';
    ctx.beginPath();
    ctx.arc(enemy.x, enemy.y, s, 0, Math.PI * 2);
    ctx.fill();
    // 暗色阴影
    ctx.fillStyle = 'rgba(60,100,40,0.4)';
    ctx.beginPath();
    ctx.arc(enemy.x + 1, enemy.y + 1, s * 0.8, 0, Math.PI * 2);
    ctx.fill();
    // 复盖亮绿身体
    ctx.fillStyle = '#88cc55';
    ctx.beginPath();
    ctx.arc(enemy.x - 0.5, enemy.y - 0.5, s * 0.7, 0, Math.PI * 2);
    ctx.fill();
    // 头顶触角
    ctx.strokeStyle = '#88cc55';
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.moveTo(enemy.x - 1, enemy.y - s * 0.8);
    ctx.lineTo(enemy.x - 1.5, enemy.y - s * 1.2);
    ctx.moveTo(enemy.x + 1, enemy.y - s * 0.8);
    ctx.lineTo(enemy.x + 1.5, enemy.y - s * 1.2);
    ctx.stroke();
    // 眼睛
    ctx.fillStyle = '#000';
    ctx.fillRect(enemy.x - 1.5, enemy.y - 1, 1, 1);
    ctx.fillRect(enemy.x + 0.5, enemy.y - 1, 1, 1);
  },

  // 普通异合体：小型黏液+触角+绿腹
  drawRegularSlime(enemy) {
    const ctx = this.ctx;
    const s = enemy.size;
    // 锈色金属外壳（身体外层）
    ctx.fillStyle = '#8a5533';
    ctx.beginPath();
    ctx.ellipse(enemy.x, enemy.y, s * 0.95, s * 0.9, 0, 0, Math.PI * 2);
    ctx.fill();
    // 锈斑
    ctx.fillStyle = 'rgba(60,40,20,0.5)';
    ctx.beginPath();
    ctx.arc(enemy.x - s * 0.4, enemy.y - s * 0.3, s * 0.2, 0, Math.PI * 2);
    ctx.arc(enemy.x + s * 0.5, enemy.y + s * 0.3, s * 0.15, 0, Math.PI * 2);
    ctx.fill();
    // 内部绿色黏液（露出部分）
    ctx.fillStyle = '#7a9944';
    ctx.beginPath();
    ctx.ellipse(enemy.x, enemy.y - s * 0.05, s * 0.6, s * 0.55, 0, 0, Math.PI * 2);
    ctx.fill();
    // 锈色外描边
    ctx.strokeStyle = '#4a2810';
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.ellipse(enemy.x, enemy.y, s * 0.95, s * 0.9, 0, 0, Math.PI * 2);
    ctx.stroke();
    // 顶部两根触角（金属管）
    ctx.strokeStyle = '#666';
    ctx.lineWidth = 1.5;
    ctx.beginPath();
    ctx.moveTo(enemy.x - s * 0.3, enemy.y - s * 0.85);
    ctx.lineTo(enemy.x - s * 0.4, enemy.y - s * 1.3);
    ctx.moveTo(enemy.x + s * 0.3, enemy.y - s * 0.85);
    ctx.lineTo(enemy.x + s * 0.4, enemy.y - s * 1.3);
    ctx.stroke();
    // 触角顶端亮绿
    ctx.fillStyle = '#aaff44';
    ctx.beginPath();
    ctx.arc(enemy.x - s * 0.4, enemy.y - s * 1.3, 1.2, 0, Math.PI * 2);
    ctx.arc(enemy.x + s * 0.4, enemy.y - s * 1.3, 1.2, 0, Math.PI * 2);
    ctx.fill();
    // 眼睛
    ctx.fillStyle = '#000';
    ctx.beginPath();
    ctx.arc(enemy.x - s * 0.3, enemy.y - s * 0.15, 1.2, 0, Math.PI * 2);
    ctx.arc(enemy.x + s * 0.3, enemy.y - s * 0.15, 1.2, 0, Math.PI * 2);
    ctx.fill();
    // 发光绿腹（径向渐变）
    const grd = ctx.createRadialGradient(enemy.x, enemy.y + s * 0.3, 1, enemy.x, enemy.y + s * 0.3, s * 0.5);
    grd.addColorStop(0, 'rgba(180,255,100,0.9)');
    grd.addColorStop(0.5, 'rgba(120,220,60,0.6)');
    grd.addColorStop(1, 'rgba(60,150,40,0)');
    ctx.fillStyle = grd;
    ctx.beginPath();
    ctx.arc(enemy.x, enemy.y + s * 0.3, s * 0.5, 0, Math.PI * 2);
    ctx.fill();
    // 小腿（2只）
    ctx.fillStyle = '#4a2810';
    ctx.fillRect(enemy.x - s * 0.5, enemy.y + s * 0.6, s * 0.3, s * 0.4);
    ctx.fillRect(enemy.x + s * 0.2, enemy.y + s * 0.6, s * 0.3, s * 0.4);
  },

  // 异合体·巨像：大型机甲+核心发光
  drawGiantMech(enemy) {
    const ctx = this.ctx;
    const s = enemy.size;
    // 阴影
    ctx.fillStyle = 'rgba(0,0,0,0.4)';
    ctx.beginPath();
    ctx.ellipse(enemy.x, enemy.y + s * 0.9, s * 0.9, s * 0.25, 0, 0, Math.PI * 2);
    ctx.fill();
    // 锈色外壳（粗糙多边形轮廓）
    ctx.fillStyle = '#6a4422';
    ctx.beginPath();
    ctx.moveTo(enemy.x - s * 0.8, enemy.y - s * 0.2);
    ctx.lineTo(enemy.x - s * 0.95, enemy.y + s * 0.3);
    ctx.lineTo(enemy.x - s * 0.7, enemy.y + s * 0.85);
    ctx.lineTo(enemy.x - s * 0.3, enemy.y + s * 0.9);
    ctx.lineTo(enemy.x + s * 0.3, enemy.y + s * 0.9);
    ctx.lineTo(enemy.x + s * 0.7, enemy.y + s * 0.85);
    ctx.lineTo(enemy.x + s * 0.95, enemy.y + s * 0.3);
    ctx.lineTo(enemy.x + s * 0.8, enemy.y - s * 0.2);
    ctx.lineTo(enemy.x + s * 0.6, enemy.y - s * 0.5);
    ctx.lineTo(enemy.x + s * 0.2, enemy.y - s * 0.85);
    ctx.lineTo(enemy.x - s * 0.2, enemy.y - s * 0.85);
    ctx.lineTo(enemy.x - s * 0.6, enemy.y - s * 0.5);
    ctx.closePath();
    ctx.fill();
    ctx.strokeStyle = '#3a2010';
    ctx.lineWidth = 2;
    ctx.stroke();
    // 锈斑
    ctx.fillStyle = 'rgba(40,25,15,0.6)';
    ctx.beginPath();
    ctx.arc(enemy.x - s * 0.5, enemy.y - s * 0.3, s * 0.18, 0, Math.PI * 2);
    ctx.arc(enemy.x + s * 0.4, enemy.y + s * 0.1, s * 0.15, 0, Math.PI * 2);
    ctx.arc(enemy.x - s * 0.3, enemy.y + s * 0.5, s * 0.2, 0, Math.PI * 2);
    ctx.fill();
    // 内部绿色黏液
    ctx.fillStyle = '#7a9944';
    ctx.beginPath();
    ctx.ellipse(enemy.x, enemy.y, s * 0.55, s * 0.6, 0, 0, Math.PI * 2);
    ctx.fill();
    // 顶部4根排气/触角
    ctx.strokeStyle = '#888';
    ctx.lineWidth = 2;
    for (let i = 0; i < 4; i++) {
      const px = enemy.x - s * 0.5 + (i % 4) * s * 0.33;
      const h = s * (0.6 + (i % 2) * 0.3);
      ctx.beginPath();
      ctx.moveTo(px, enemy.y - s * 0.7);
      ctx.lineTo(px + (i % 2 ? -3 : 3), enemy.y - s * 0.7 - h);
      ctx.stroke();
      // 顶端绿色发光
      ctx.fillStyle = '#aaff44';
      ctx.beginPath();
      ctx.arc(px + (i % 2 ? -3 : 3), enemy.y - s * 0.7 - h, 1.8, 0, Math.PI * 2);
      ctx.fill();
    }
    // 大型核心绿光（径向渐变）
    const coreGrd = ctx.createRadialGradient(enemy.x, enemy.y + s * 0.2, 2, enemy.x, enemy.y + s * 0.2, s * 0.55);
    coreGrd.addColorStop(0, 'rgba(200,255,120,0.95)');
    coreGrd.addColorStop(0.3, 'rgba(140,240,80,0.8)');
    coreGrd.addColorStop(0.7, 'rgba(80,180,40,0.4)');
    coreGrd.addColorStop(1, 'rgba(40,120,20,0)');
    ctx.fillStyle = coreGrd;
    ctx.beginPath();
    ctx.arc(enemy.x, enemy.y + s * 0.2, s * 0.55, 0, Math.PI * 2);
    ctx.fill();
    // 核心高亮
    ctx.fillStyle = 'rgba(220,255,180,0.8)';
    ctx.beginPath();
    ctx.arc(enemy.x - s * 0.1, enemy.y + s * 0.1, s * 0.12, 0, Math.PI * 2);
    ctx.fill();
    // 多个LED小灯点缀
    ctx.fillStyle = '#88ff44';
    for (let i = 0; i < 3; i++) {
      const a = (i * Math.PI * 2) / 3;
      const lx = enemy.x + Math.cos(a) * s * 0.7;
      const ly = enemy.y + Math.sin(a) * s * 0.3 + s * 0.1;
      ctx.beginPath();
      ctx.arc(lx, ly, 1.5, 0, Math.PI * 2);
      ctx.fill();
    }
    // 眼睛（斜视上方）
    ctx.fillStyle = '#000';
    ctx.beginPath();
    ctx.arc(enemy.x - s * 0.3, enemy.y - s * 0.45, 1.5, 0, Math.PI * 2);
    ctx.arc(enemy.x + s * 0.3, enemy.y - s * 0.45, 1.5, 0, Math.PI * 2);
    ctx.fill();
    // 粗壮双腿
    ctx.fillStyle = '#4a2810';
    ctx.fillRect(enemy.x - s * 0.55, enemy.y + s * 0.7, s * 0.35, s * 0.5);
    ctx.fillRect(enemy.x + s * 0.2, enemy.y + s * 0.7, s * 0.35, s * 0.5);
    // 脚
    ctx.fillStyle = '#2a1408';
    ctx.fillRect(enemy.x - s * 0.6, enemy.y + s * 1.1, s * 0.45, s * 0.2);
    ctx.fillRect(enemy.x + s * 0.15, enemy.y + s * 1.1, s * 0.45, s * 0.2);
  },

  drawProjectiles() {
    const ctx = this.ctx;
    for (const p of ProjectileSystem.projectiles) {
      // 拖尾效果
      ctx.fillStyle = p.color;
      ctx.globalAlpha = 0.25;
      ctx.beginPath();
      ctx.arc(p.x, p.y, 7, 0, Math.PI * 2);
      ctx.fill();

      // 弹丸主体
      ctx.globalAlpha = 1;
      ctx.fillStyle = '#fff';
      ctx.beginPath();
      ctx.arc(p.x, p.y, 5, 0, Math.PI * 2);
      ctx.fill();

      // 弹丸外光
      ctx.fillStyle = p.color;
      ctx.globalAlpha = 0.7;
      ctx.beginPath();
      ctx.arc(p.x, p.y, 4, 0, Math.PI * 2);
      ctx.fill();
      ctx.globalAlpha = 1;
    }
  },

  drawPlacementPreview() {
    const ctx = this.ctx;
    // 拖动塔的目标格预览
    if (Input.draggingTower) {
      const col = Input.hoverCol;
      const row = Input.hoverRow;
      if (col >= 0 && col < CONFIG.GRID_COLS && row >= 0 && row < CONFIG.GRID_ROWS) {
        const x = col * CONFIG.TILE_SIZE;
        const y = row * CONFIG.TILE_SIZE;
        const canPlace = MapSystem.canPlaceTower(col, row) ||
                         (col === Input.draggingTower.col && row === Input.draggingTower.row);
        ctx.fillStyle = canPlace ? 'rgba(100,255,100,0.3)' : 'rgba(255,50,50,0.3)';
        ctx.fillRect(x, y, CONFIG.TILE_SIZE, CONFIG.TILE_SIZE);
        ctx.strokeStyle = canPlace ? 'rgba(100,255,100,0.9)' : 'rgba(255,50,50,0.9)';
        ctx.lineWidth = 2;
        ctx.strokeRect(x + 1, y + 1, CONFIG.TILE_SIZE - 2, CONFIG.TILE_SIZE - 2);
      }
      return;
    }
    if (!Input.placingType) return;
    const col = Input.hoverCol;
    const row = Input.hoverRow;
    if (col < 0 || col >= CONFIG.GRID_COLS || row < 0 || row >= CONFIG.GRID_ROWS) return;

    const x = col * CONFIG.TILE_SIZE;
    const y = row * CONFIG.TILE_SIZE;
    const canPlace = MapSystem.canPlaceTower(col, row);

    ctx.fillStyle = canPlace ? 'rgba(100,255,100,0.25)' : 'rgba(255,50,50,0.25)';
    ctx.fillRect(x, y, CONFIG.TILE_SIZE, CONFIG.TILE_SIZE);

    ctx.strokeStyle = canPlace ? 'rgba(100,255,100,0.7)' : 'rgba(255,50,50,0.7)';
    ctx.lineWidth = 2;
    ctx.strokeRect(x + 1, y + 1, CONFIG.TILE_SIZE - 2, CONFIG.TILE_SIZE - 2);

    // 范围预览
    const typeDef = CONFIG.TOWER_TYPES[Input.placingType];
    const range = typeDef.levels[0].range;
    const cx = col * CONFIG.TILE_SIZE + CONFIG.TILE_SIZE / 2;
    const cy = row * CONFIG.TILE_SIZE + CONFIG.TILE_SIZE / 2;

    // 范围填充
    ctx.fillStyle = 'rgba(255,255,200,0.08)';
    ctx.beginPath();
    ctx.arc(cx, cy, range, 0, Math.PI * 2);
    ctx.fill();

    // 范围边框
    ctx.strokeStyle = 'rgba(255,255,200,0.5)';
    ctx.lineWidth = 1.5;
    ctx.setLineDash([5, 5]);
    ctx.beginPath();
    ctx.arc(cx, cy, range, 0, Math.PI * 2);
    ctx.stroke();
    ctx.setLineDash([]);
    ctx.lineWidth = 1;
  },

  drawSelectionHighlight() {
    if (!Input.selectedTower) return;
    const t = Input.selectedTower;
    const ctx = this.ctx;
    const x = t.col * CONFIG.TILE_SIZE;
    const y = t.row * CONFIG.TILE_SIZE;

    ctx.strokeStyle = '#ffd700';
    ctx.lineWidth = 3;
    ctx.strokeRect(x + 1, y + 1, CONFIG.TILE_SIZE - 2, CONFIG.TILE_SIZE - 2);

    // 发光效果
    ctx.strokeStyle = 'rgba(255,215,0,0.3)';
    ctx.lineWidth = 6;
    ctx.strokeRect(x - 2, y - 2, CONFIG.TILE_SIZE + 4, CONFIG.TILE_SIZE + 4);
  },

  drawHUD() {
    const ctx = this.ctx;

    // 左上角当前选择状态
    if (Input.placingType) {
      const def = CONFIG.TOWER_TYPES[Input.placingType];
      ctx.fillStyle = 'rgba(0,0,0,0.6)';
      ctx.fillRect(5, 5, 140, 30);
      ctx.fillStyle = '#ffd700';
      ctx.font = '12px sans-serif';
      ctx.textAlign = 'left';
      ctx.fillText(`${def.icon} 放置: ${def.name} (${def.cost}金币)`, 12, 25);
    }

    // 暂停状态巨型水印（醒目）
    if (GameState.state === 'PAUSED') {
      ctx.save();
      ctx.fillStyle = 'rgba(0,0,0,0.35)';
      ctx.fillRect(0, 0, CONFIG.CANVAS_W, CONFIG.CANVAS_H);

      ctx.translate(CONFIG.CANVAS_W / 2, CONFIG.CANVAS_H / 2);
      ctx.rotate(-0.2);
      ctx.fillStyle = 'rgba(255,215,0,0.85)';
      ctx.font = 'bold 80px sans-serif';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText('⏸ 已 暂 停', 0, -20);
      ctx.font = '20px sans-serif';
      ctx.fillStyle = 'rgba(255,255,255,0.7)';
      ctx.fillText('按 继续游戏 或 Space 恢复', 0, 50);
      ctx.restore();
    }

    // 左下角调试 HUD（实时）
    ctx.fillStyle = 'rgba(0,0,0,0.55)';
    ctx.fillRect(5, CONFIG.CANVAS_H - 70, 225, 65);
    ctx.fillStyle = '#88ff88';
    ctx.font = '11px monospace';
    ctx.textAlign = 'left';
    ctx.textBaseline = 'top';
    ctx.fillText(`FPS: ${GameLoop.currentFPS}   ${GameLoop.gameSpeed}x速度  状态: ${GameState.state}`, 10, CONFIG.CANVAS_H - 65);
    ctx.fillText(`敌: ${EnemySystem.enemies.length}  塔: ${TowerSystem.towers.length}  弹: ${ProjectileSystem.projectiles.length}`, 10, CONFIG.CANVAS_H - 50);
    ctx.fillText(`波次: ${WaveManager.currentWave}/${WaveManager.totalWaves}  ${WaveManager.waveActive ? '进行中' : '空闲'}`, 10, CONFIG.CANVAS_H - 35);
    ctx.fillText(`击杀: ${Stats.kills}  金币: ${Economy.gold}  生命: ${Lives.lives}`, 10, CONFIG.CANVAS_H - 20);

    // Buff 状态指示（右上角醒目）
    const buffText = BuffSystem.getStatusText();
    if (buffText) {
      const pulse = Math.sin(performance.now() / 300) * 0.2 + 0.8;
      const isPower = BuffSystem.type === 'power';
      const buffW = 280;
      const buffX = CONFIG.CANVAS_W - buffW - 5;

      ctx.fillStyle = isPower ? 'rgba(255,200,0,0.18)' : 'rgba(200,150,40,0.15)';
      ctx.fillRect(buffX, 5, buffW, 40);
      ctx.strokeStyle = `rgba(255,200,0,${pulse})`;
      ctx.lineWidth = isPower ? 3 : 2;
      ctx.strokeRect(buffX, 5, buffW, 40);
      ctx.fillStyle = isPower ? '#ffdd44' : '#ffcc66';
      ctx.font = isPower ? 'bold 13px sans-serif' : 'bold 12px sans-serif';
      ctx.textAlign = 'center';
      ctx.fillText(buffText, buffX + buffW / 2, 30);
    }
  }
};

// ==================== 游戏循环 ====================
const GameLoop = {
  lastTime: 0,
  running: false,
  rafId: null,
  frameCount: 0,
  fpsUpdateTime: 0,
  currentFPS: 60,
  gameTime: 0,          // 游戏逻辑时间（受倍速影响）
  gameSpeed: 1,         // 当前倍速
  SPEED_OPTIONS: [1, 2, 3],

  start() {
    if (this.running) return;
    this.running = true;
    this.lastTime = performance.now();
    this.gameTime = 0;
    this.gameSpeed = 1;
    this.frameCount = 0;
    this.fpsUpdateTime = this.lastTime;
    this.loop(this.lastTime);
    TestLog.info('LOOP', '游戏循环启动');
  },

  setSpeed(speed) {
    this.gameSpeed = speed;
    TestLog.info('LOOP', `倍速切换为 ${speed}x`);
    UI.updateSpeedButton();
  },

  toggleSpeed() {
    const idx = this.SPEED_OPTIONS.indexOf(this.gameSpeed);
    const next = this.SPEED_OPTIONS[(idx + 1) % this.SPEED_OPTIONS.length];
    this.setSpeed(next);
  },

  stop() {
    this.running = false;
    if (this.rafId) {
      cancelAnimationFrame(this.rafId);
      this.rafId = null;
    }
    TestLog.info('LOOP', '游戏循环停止');
  },

  loop(timestamp) {
    if (!this.running) return;

    const delta = Math.min(timestamp - this.lastTime, 100); // 防止大delta（tab切换）
    this.lastTime = timestamp;

    // 游戏逻辑时间累加（受倍速影响）
    this.gameTime += delta * this.gameSpeed;

    // FPS统计
    this.frameCount++;
    if (timestamp - this.fpsUpdateTime >= 1000) {
      this.currentFPS = Math.round(this.frameCount * 1000 / (timestamp - this.fpsUpdateTime));
      this.frameCount = 0;
      this.fpsUpdateTime = timestamp;
    }

    // 只在PLAYING状态更新游戏逻辑
    if (GameState.state === 'PLAYING') {
      this.update(delta * this.gameSpeed, this.gameTime);
    }

    // 所有状态都渲染
    Renderer.render();

    this.rafId = requestAnimationFrame((t) => this.loop(t));
  },

  update(delta, timestamp) {
    // 波次系统更新
    WaveManager.update(timestamp);

    // 敌人系统更新
    EnemySystem.update(delta, timestamp);

    // 塔系统更新（攻击）
    TowerSystem.update(EnemySystem.enemies, timestamp, ProjectileSystem);

    // 弹丸系统更新
    ProjectileSystem.update(delta, EnemySystem.enemies, timestamp);

    // UI更新
    UI.updateStats();

    // 性能日志（每30秒）
    if (Math.floor(timestamp / 30000) !== Math.floor((timestamp - delta) / 30000)) {
      TestLog.info('PERF', `FPS: ${this.currentFPS}, 敌人: ${EnemySystem.enemies.length}, 塔: ${TowerSystem.towers.length}, 弹丸: ${ProjectileSystem.projectiles.length}`);
    }
  }
};

window.DG = {

  Stats,
  Lives,
  EnemySystem,
  WaveManager,
  AchievementSystem,
  SaveManager,
  Settings,
  BuffSystem,
  SplitSystem,
  Input,
  TestLog,
  UI,

  // 便捷测试方法
  addGold(amount) {
    Economy.gold += amount;
    TestLog.info('TEST', `添加 ${amount} 金币, 当前: ${Economy.gold}`);
    UI.updateAll();
  },
  killAll() {
    for (const e of EnemySystem.enemies) {
      e.hp = 0;
      e.dead = true;
      Stats.kills++;
    }
    EnemySystem.enemies = [];
    TestLog.info('TEST', '清除所有敌人');
    UI.updateAll();
  },
  skipWave() {
    if (WaveManager.waveActive) {
      WaveManager.completeWave();
      TestLog.info('TEST', '跳过当前波次');
      UI.updateAll();
    }
  },
  resetAll() {
    SaveManager.delete();
    localStorage.removeItem(SaveManager.SAVE_KEY);
    GameState.reset();
    GameLoop.stop();
    $('body').innerHTML = '';
    TestLog.info('TEST', '完全重置');
    location.reload();
  },
  getState() {
    return {
      state: GameState.state,
      gold: Economy.gold,
      lives: Lives.lives,
      wave: WaveManager.currentWave,
      waveActive: WaveManager.waveActive,
      enemies: EnemySystem.enemies.length,
      towers: TowerSystem.towers.length,
      projectiles: ProjectileSystem.projectiles.length,
      fps: GameLoop.currentFPS,
      kills: Stats.kills,
      achievements: AchievementSystem.getUnlocked().map(a => a.name),
      errors: TestLog.getErrors().length,
    };
  },
  getLog(level) {
    const history = TestLog.getHistory();
    if (level) return history.filter(e => e.level === level);
    return history;
  },
};

// ==================== 启动 ====================
(function main() {
  TestLog.info('SYSTEM', '========== Dungeon Guardian 启动 ==========');

  Renderer.init();
  MapSystem.init();
  Input.init();
  UI.init();
  GameLoop.start();

  // 默认显示菜单
  UI.showMenu(true);

  TestLog.info('SYSTEM', '游戏初始化完成，测试接口可通过 window.DG 访问');
  console.log('%c🔮 Dungeon Guardian 已就绪 %c| %c在控制台输入 DG.getState() 查看状态',
    'font-size:16px;color:#ffd700;', '', 'color:#8af;');
  console.log('%c测试接口: %cDG.addGold(500) | DG.killAll() | DG.skipWave() | DG.getState() | DG.getLog()',
    'color:#ffd700;', 'color:#8af;');
})();
</script>
