<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>失控 OUT OF CONTROL</title>
<style>
/* ============ CSS Reset & Base ============ */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
  background: #050810;
  display: flex; justify-content: center; align-items: center;
  min-height: 100vh; overflow: hidden;
}
/* ============ Game Container ============ */
#game-container {
  display: flex; gap: 0;
  border: 1px solid rgba(80,140,200,0.3); border-radius: 8px;
  overflow: hidden; box-shadow: 0 0 80px rgba(60,140,220,0.15);
  position: relative;
}
/* ============ Canvas ============ */
#game-canvas {
  display: block; background: #050810;
  cursor: crosshair;
}
/* ============ Side Panel ============ */
#side-panel {
  width: 280px; background: #0a1020; color: #c8d8e8;
  display: flex; flex-direction: column;
  padding: 12px; gap: 8px;
  font-size: 13px; user-select: none;
  border-left: 1px solid rgba(80,140,200,0.3);
}
#side-panel h2 { font-size: 16px; color: #66bbff; text-align: center; margin-bottom: 4px; letter-spacing: 2px; }
.panel-section {
  background: rgba(20,30,50,0.6); border: 1px solid rgba(80,140,200,0.25); border-radius: 6px;
  padding: 10px;
  backdrop-filter: blur(8px);
  -webkit-backdrop-filter: blur(8px);
}
.panel-section h3 { font-size: 13px; color: #66bbff; margin-bottom: 6px; border-bottom: 1px solid rgba(80,140,200,0.2); padding-bottom: 4px; }
.stat-row { display: flex; justify-content: space-between; margin: 4px 0; }
.stat-label { color: #7788aa; }
.stat-value { color: #88ddff; font-weight: bold; }
.stat-value.danger { color: #ff5577; }

/* Tower Buttons */
.tower-btn {
  width: 100%; padding: 8px; margin: 3px 0;
  background: rgba(20,30,50,0.6); color: #c8d8e8; border: 1px solid rgba(80,140,200,0.3);
  border-radius: 5px; cursor: pointer; text-align: left;
  font-size: 12px; transition: all 0.15s;
  display: flex; align-items: center; gap: 8px;
  backdrop-filter: blur(6px);
  -webkit-backdrop-filter: blur(6px);
}
.tower-btn:hover { background: rgba(40,60,90,0.8); border-color: rgba(100,180,240,0.6); transform: translateX(2px); }
.tower-btn.selected { border-color: #66bbff; background: rgba(60,100,160,0.5); box-shadow: 0 0 10px rgba(100,180,240,0.3); }
.tower-btn .tower-icon { font-size: 20px; width: 28px; text-align: center; }
.tower-btn .tower-info { flex: 1; }
.tower-btn .tower-name { font-weight: bold; color: #fff; }
.tower-btn .tower-cost { color: #88ddff; font-size: 11px; }
.tower-btn .tower-desc { color: #7788aa; font-size: 10px; }
.tower-btn .tower-count {
  position: absolute; right: 8px; top: 50%; transform: translateY(-50%);
  background: rgba(80,140,200,0.25); color: #88ccff;
  padding: 2px 7px; border-radius: 10px;
  font-size: 11px; font-weight: bold;
  border: 1px solid rgba(120,180,220,0.4);
}
.tower-btn { position: relative; }

/* 塔按钮 hover 预览 tooltip */
#tower-tooltip {
  position: fixed; z-index: 300;
  max-width: 360px;
  background: rgba(16,24,40,0.92);
  border: 1px solid rgba(120,170,230,0.45);
  border-radius: 10px;
  padding: 12px 14px;
  color: #ffd76e; font-size: 12px; line-height: 1.7;
  box-shadow: 0 8px 28px rgba(0,0,0,0.5), 0 0 20px rgba(60,140,220,0.2);
  backdrop-filter: blur(14px) saturate(160%);
  -webkit-backdrop-filter: blur(14px) saturate(160%);
  pointer-events: auto;
  display: none;
}
#tower-tooltip .tt-title { font-size: 14px; font-weight: bold; color: #66bbff; margin-bottom: 4px; }
#tower-tooltip .tt-level { margin-top: 2px; }
/* 动作词（拥有/移除/获得/LvX）= 黄色 */
#tower-tooltip .tt-verb { color: #ffd76e; }
/* buff 名 = 蓝色 + 下划线 */
#tower-tooltip .tt-buffname {
  color: #66bbff;
  text-decoration: underline;
  text-decoration-color: #66bbff;
  text-underline-offset: 2px;
  cursor: help;
}

/* buff 词条详情浮窗（hover buff 名显示，二级菜单） */
#buff-detail-tooltip {
  position: fixed; z-index: 320;
  max-width: 440px;
  background: rgba(12,20,34,0.96);
  border: 1px solid rgba(100,180,255,0.6);
  border-radius: 10px;
  padding: 12px 14px;
  color: #ffd76e; font-size: 12px; line-height: 1.7;
  box-shadow: 0 10px 32px rgba(0,0,0,0.6), 0 0 24px rgba(80,160,255,0.25);
  backdrop-filter: blur(14px) saturate(160%);
  -webkit-backdrop-filter: blur(14px) saturate(160%);
  pointer-events: none;
  display: none;
  white-space: pre-line;
}
#buff-detail-tooltip .bd-title {
  font-size: 14px; font-weight: bold; color: #66bbff;
  border-bottom: 1px solid #66bbff;
  margin-bottom: 6px; padding-bottom: 4px;
}
#buff-detail-tooltip .bd-buff { color: #66bbff; }


/* Buttons */
.btn {
  padding: 8px 16px; border: 2px solid #5a5a88; border-radius: 5px;
  cursor: pointer; font-size: 13px; font-weight: bold;
  transition: all 0.15s;
}
.btn-primary { background: #4466aa; color: #fff; border-color: #6688cc; }
.btn-primary:hover { background: #5577bb; }
.btn-warning { background: #aa6633; color: #fff; border-color: #cc8844; }
.btn-warning:hover { background: #bb7744; }
.btn-danger { background: #aa3333; color: #fff; border-color: #cc4444; }
.btn-danger:hover { background: #bb4444; }
.btn-success { background: #33aa44; color: #fff; border-color: #44cc55; }
.btn-success:hover { background: #44bb55; }
.btn-secondary { background: #335577; color: #fff; border-color: #446688; }
.btn-secondary:hover { background: #446688; }
/* 液态玻璃按钮（主菜单） */
.btn-glass {
  background: rgba(140,180,220,0.12);
  color: #e8f2fb;
  border: 1px solid rgba(160,200,240,0.35);
  border-radius: 10px;
  backdrop-filter: blur(12px) saturate(160%);
  -webkit-backdrop-filter: blur(12px) saturate(160%);
  box-shadow: 0 4px 16px rgba(0,0,0,0.25), inset 0 1px 0 rgba(255,255,255,0.18);
  min-width: 180px;
}
.btn-glass:hover {
  background: rgba(160,200,240,0.22);
  border-color: rgba(180,220,255,0.6);
  box-shadow: 0 6px 22px rgba(60,140,220,0.35), inset 0 1px 0 rgba(255,255,255,0.25);
  transform: translateY(-1px);
}
/* 黑沉禁用态（解锁未达/条件不满足） */
.btn-locked,
.btn-locked:hover {
  background: linear-gradient(180deg, #1a1d22 0%, #14171c 100%);
  color: #555a66;
  border-color: #2a2d34;
  box-shadow: inset 0 2px 6px rgba(0,0,0,0.6), inset 0 -1px 0 rgba(255,255,255,0.03);
  cursor: not-allowed;
  text-shadow: 0 1px 0 rgba(0,0,0,0.5);
}
/* 金币不足（可点击但灰色降饱和） */
.btn-poor {
  background: #3a3f47 !important;
  color: #8a93a3 !important;
  border-color: #4a5058 !important;
  box-shadow: inset 0 2px 6px rgba(0,0,0,0.4);
  cursor: pointer;
}
.btn-poor:hover { background: #464c56 !important; }
/* 金币不足向上丝滑提示 */
.upgrade-hint {
  display: none;
  position: absolute; left: 0; right: 0;
  background: rgba(255, 60, 60, 0.95);
  color: #fff;
  padding: 5px 12px;
  border-radius: 8px;
  font-size: 12px; font-weight: bold; text-align: center;
  box-shadow: 0 4px 16px rgba(255,60,60,0.5);
  animation: upgradeHintUp 1.6s ease-out forwards;
  pointer-events: none;
  z-index: 5;
}
.upgrade-hint.show { display: block; }
@keyframes upgradeHintUp {
  0%   { transform: translateY(15px); opacity: 0; }
  15%  { transform: translateY(0); opacity: 1; }
  75%  { transform: translateY(-10px); opacity: 1; }
  100% { transform: translateY(-26px); opacity: 0; }
}

/* ============ Overlay / Modal ============ */
.overlay {
  position: fixed; top: 0; left: 0; width: 100%; height: 100%;
  background: rgba(0,0,0,0.6);
  display: flex;
  justify-content: center; align-items: center; z-index: 100;
  backdrop-filter: blur(8px);
  -webkit-backdrop-filter: blur(8px);
}
.overlay.hidden { display: none; }
.modal {
  background: rgba(20,30,55,0.45);
  backdrop-filter: blur(30px) saturate(180%);
  -webkit-backdrop-filter: blur(30px) saturate(180%);
  border: 1px solid rgba(140,180,220,0.25);
  border-radius: 24px;
  padding: 36px 30px; min-width: 380px; max-width: 500px;
  color: #d8e4f0; text-align: center;
  box-shadow:
    0 20px 60px rgba(0,0,0,0.5),
    inset 0 1px 0 rgba(255,255,255,0.15),
    inset 0 -1px 0 rgba(255,255,255,0.05);
  position: relative;
  overflow: hidden;
}
.modal::before {
  content: '';
  position: absolute; top: 0; left: 0; right: 0; height: 1px;
  background: linear-gradient(90deg, transparent, rgba(180,210,240,0.4), transparent);
}
.modal h1 { font-size: 26px; color: #0a0a14; margin-bottom: 12px; margin-top: 0; letter-spacing: 4px; font-weight: 200; text-shadow: 0 1px 0 rgba(255,255,255,0.4); }
.modal h2 { font-size: 14px; color: #88c8ff; margin-bottom: 8px; letter-spacing: 6px; font-weight: 500; text-transform: uppercase; }
.modal p { margin: 8px 0; color: #7788aa; font-size: 14px; }
.modal .btn { margin: 6px; min-width: 140px; }
.modal-close {
  position: absolute; top: 10px; right: 14px;
  background: transparent; border: none;
  color: #88aa66; font-size: 28px; cursor: pointer;
  padding: 0; line-height: 1;
}
.modal-close:hover { color: #fff; }
#upgrade-modal-content { position: relative; min-width: 320px; }

/* Achievement Toast */
.toast {
  position: fixed; top: 20px; right: 20px;
  background: rgba(20,30,55,0.7); border: 1px solid rgba(100,180,240,0.5);
  color: #88ddff; padding: 12px 20px; border-radius: 10px;
  font-size: 14px; z-index: 200;
  animation: toastIn 0.3s ease-out, toastOut 0.3s ease-in 2.5s forwards;
  box-shadow: 0 4px 20px rgba(60,140,220,0.3);
  backdrop-filter: blur(12px);
  -webkit-backdrop-filter: blur(12px);
}
@keyframes toastIn { from { transform: translateX(100%); opacity: 0; } to { transform: translateX(0); opacity: 1; } }
@keyframes toastOut { from { transform: translateX(0); opacity: 1; } to { transform: translateX(100%); opacity: 0; } }

/* ============ Scrollbar ============ */
::-webkit-scrollbar { width: 6px; }
::-webkit-scrollbar-track { background: #0a1020; }
::-webkit-scrollbar-thumb { background: rgba(80,140,200,0.4); border-radius: 3px; }
::-webkit-scrollbar-thumb:hover { background: rgba(100,180,240,0.6); }
</style>
</head>
<body>

<audio id="bgm" src="bgm_ambient.wav" loop preload="auto"></audio>

<div id="game-container">
  <canvas id="game-canvas" width="800" height="600"></canvas>
  <div id="side-panel">
    <h2>⚡ 实验区 #01</h2>

    <div class="panel-section">
      <h3>资源</h3>
      <div class="stat-row"><span class="stat-label">金币</span><span class="stat-value" id="stat-gold">200</span></div>
      <div class="stat-row"><span class="stat-label">生命</span><span class="stat-value" id="stat-lives">20</span></div>
      <div class="stat-row"><span class="stat-label">波次</span><span class="stat-value" id="stat-wave">0/20</span></div>
      <div class="stat-row"><span class="stat-label">得分</span><span class="stat-value" id="stat-score">0</span></div>
      <div class="stat-row"><span class="stat-label">击杀</span><span class="stat-value" id="stat-kills">0</span></div>
    </div>

    <div class="panel-section" id="tower-shop">
      <h3>防御阵列</h3>
      <div id="tower-buttons"></div>
    </div>

    <div class="panel-section" id="tower-info-panel" style="display:none; position:relative;">
      <h3>选中塔信息</h3>
      <div id="tower-info-content"></div>
      <div id="upgrade-hint-side" class="upgrade-hint">金币不足</div>
      <button class="btn btn-warning" id="btn-upgrade" style="width:100%;margin-top:6px;">升级 (0金币)</button>
      <button class="btn btn-secondary" id="btn-pursuit" style="width:100%;margin-top:4px;display:none;">追击模式：开</button>
      <button class="btn btn-danger" id="btn-sell" style="width:100%;margin-top:4px;">出售 (0金币)</button>
    </div>

    <div class="panel-section">
      <h3>操作</h3>
      <button class="btn btn-primary" id="btn-start-wave" style="width:100%;">开始下一波</button>
      <div style="display:flex;gap:4px;margin-top:4px;">
        <button class="btn btn-warning" id="btn-pause" style="flex:1;">暂停 (Space)</button>
        <button class="btn btn-danger" id="btn-restart-wave" style="flex:1;">重置当前波次</button>
      </div>
      <button class="btn btn-secondary" id="btn-speed" style="width:100%;margin-top:4px;">倍速 1x (F)</button>
      <button class="btn btn-success" id="btn-save" style="width:100%;margin-top:4px;">保存游戏</button>
      <button class="btn btn-danger" id="btn-menu" style="width:100%;margin-top:4px;">返回菜单</button>
    </div>

    <div class="panel-section">
      <h3>快捷键</h3>
      <div style="font-size:11px;color:#777;">
        <div>1-4 选择塔 | Space 暂停</div>
        <div>Esc 取消选择 | S 出售</div>
        <div>U 升级 | Enter 开始波次</div>
        <div>F 倍速 | 右键 取消选择</div>
      </div>
    </div>
  </div>
</div>

<!-- 塔按钮 hover 预览 tooltip -->
<div id="tower-tooltip"></div>
<!-- buff 词条详情浮窗（hover buff 名时显示） -->
<div id="buff-detail-tooltip"></div>

<!-- Main Menu Overlay -->
<div class="overlay" id="overlay-menu">
  <div class="modal">
    <h2>失控</h2>
    <h1>OUT OF CONTROL</h1>
    <br>
    <button class="btn btn-glass" id="btn-new-game">新游戏</button>
    <button class="btn btn-glass hidden" id="btn-continue">继续游戏</button>
    <button class="btn btn-glass" id="btn-settings" style="margin-top:4px;">设置</button>
  </div>
</div>

<!-- Settings Overlay -->
<div class="overlay hidden" id="overlay-settings">
  <div class="modal">
    <h2>设置</h2>
    <div style="text-align:left;margin:16px 0;">
      <label style="display:block;margin:10px 0;">音量: <span id="vol-label">70%</span>
        <input type="range" id="vol-slider" min="0" max="100" value="70" style="width:100%;">
      </label>
      <label style="display:block;margin:10px 0;">难度:
        <select id="difficulty-select" style="width:100%;padding:6px;margin-top:4px;background:#1e1e35;color:#ddd;border:1px solid #3a3a55;border-radius:4px;">
          <option value="easy">简单</option>
          <option value="normal" selected>普通</option>
          <option value="hard">困难</option>
        </select>
      </label>
    </div>
    <button class="btn btn-primary" id="btn-settings-close">返回</button>
  </div>
</div>

<!-- Pause Overlay -->
<div class="overlay hidden" id="overlay-pause">
  <div class="modal">
    <h2>游戏暂停</h2>
    <button class="btn btn-primary" id="btn-resume">继续游戏</button>
    <button class="btn btn-success" id="btn-save-pause" style="margin-top:6px;">保存游戏</button>
    <button class="btn btn-danger" id="btn-quit" style="margin-top:6px;">返回菜单</button>
  </div>
</div>

<!-- Tower Upgrade Popup -->
<div class="overlay hidden" id="overlay-upgrade">
  <div class="modal" id="upgrade-modal-content">
    <button class="modal-close" id="btn-upgrade-close" title="关闭">×</button>
    <h2 id="upgrade-title">🛡️ 升级</h2>
    <div id="upgrade-tower-icon" style="font-size:48px;margin:8px 0;">🏹</div>
    <div id="upgrade-tower-name" style="font-size:18px;font-weight:bold;color:#ffdd55;">弓箭塔</div>
    <div id="upgrade-tower-level" style="font-size:13px;color:#88cc44;margin:4px 0;">等级 1 / 3</div>
    <div id="upgrade-stats" style="text-align:left;background:#1e3510;padding:12px;border-radius:6px;margin:12px 0;font-size:13px;line-height:1.8;"></div>
    <div id="upgrade-special" style="text-align:left;background:#3a2a10;padding:10px;border-radius:6px;margin:8px 0;font-size:12px;color:#ffaa66;display:none;"></div>
    <div style="display:flex;gap:8px;justify-content:center;margin-top:10px;">
      <button class="btn btn-warning" id="btn-upgrade-popup" style="flex:1;">升级</button>
      <button class="btn btn-danger" id="btn-sell-popup" style="flex:1;">出售</button>
    </div>
    <p style="font-size:11px;color:#88aa66;margin-top:10px;">💡 点击地图空白处或按 Esc 关闭</p>
  </div>
</div>

<!-- Game Over Overlay -->
<div class="overlay hidden" id="overlay-gameover">
  <div class="modal">
    <h2 id="gameover-title">游戏结束</h2>
    <div id="gameover-stats" style="text-align:left;margin:16px 0;"></div>
    <button class="btn btn-primary" id="btn-restart">重新开始</button>
    <button class="btn btn-danger" id="btn-menu-from-over">返回菜单</button>
  </div>
</div>

<!-- Toast Container -->
<div id="toast-container"></div>

<script>
/* ====================================================================================
   DUNGEON GUARDIAN - 地牢守卫者
   塔防游戏 · 为游戏测试而设计
   版本: 1.0.0
   ==================================================================================== */

// ==================== 工具函数 ====================
const $ = (sel) => document.querySelector(sel);
const $$ = (sel) => document.querySelectorAll(sel);
const clamp = (v, min, max) => Math.max(min, Math.min(max, v));
const rand = (min, max) => Math.floor(Math.random() * (max - min + 1)) + min;
const randf = (min, max) => Math.random() * (max - min) + min;
const dist = (x1, y1, x2, y2) => Math.sqrt((x2-x1)**2 + (y2-y1)**2);

// ==================== 日志系统（测试专用） ====================
const TestLog = {
  enabled: true,
  _history: [],
  log(level, system, msg, data) {
    if (!this.enabled) return;
    const entry = { time: Date.now(), level, system, msg, data };
    this._history.push(entry);
    if (this._history.length > 1000) this._history.shift();
    const prefix = `[${system}]`;
    const style = level === 'ERROR' ? 'color:red;font-weight:bold' :
                  level === 'WARN' ? 'color:orange' : 'color:#8af';
    console.log(`%c${prefix} ${msg}`, style, data || '');
  },
  info(system, msg, data) { this.log('INFO', system, msg, data); },
  warn(system, msg, data) { this.log('WARN', system, msg, data); },
  error(system, msg, data) { this.log('ERROR', system, msg, data); },
  getHistory() { return [...this._history]; },
  getErrors() { return this._history.filter(e => e.level === 'ERROR'); }
};

// ==================== 配置常量 ====================
const CONFIG = {
  CANVAS_W: 800,
  CANVAS_H: 600,
  GRID_COLS: 20,
  GRID_ROWS: 15,
  TILE_SIZE: 40,
  FPS: 60,
  FRAME_TIME: 1000 / 60,
  LAND_THEME: true,  // 草原主题标记

  // 初始资源
  START_GOLD: 250,
  START_LIVES: 20,

  // 塔类型定义（v2.0 大重做）
  TOWER_TYPES: {
    archer: {
      id: 'archer', name: '速射钉枪阵列', icon: '🔫',
      desc: '高速射击，锈蚀易伤',
      cost: 50,
      levels: [
        { damage: 15, range: 120, fireRate: 800,  color: '#44aa44' },
        { damage: 25, range: 140, fireRate: 700,  color: '#55cc55', buff1: true },
        { damage: 40, range: 160, fireRate: 600,  color: '#66ee66', buff2: true },
      ],
      upgradeCosts: [175, 320],
      projectileColor: '#44aa44',
      projectileSpeed: 8,
    },
    cannon: {
      id: 'cannon', name: '远程电子矩阵', icon: '💥',
      desc: '九宫格增益 + 追击伤害',
      cost: 80,
      levels: [
        { damage: 40, range: 100, fireRate: 2000, color: '#cc5533', aoe: 50 },
        { damage: 60, range: 120, fireRate: 1800, color: '#dd4422', aoe: 65 },
        { damage: 90, range: 140, fireRate: 1600, color: '#ff3322', aoe: 80, buff: true },
      ],
      upgradeCosts: [180, 400],
      projectileColor: '#cc5533',
      projectileSpeed: 5,
    },
    ice: {
      id: 'ice', name: '液氮抑制剂', icon: '🧊',
      desc: '冻结定身 / 混合伤害',
      cost: 60,
      levels: [
        { damage: 8,  range: 110, fireRate: 1200, color: '#55aacc', slow: 0.4, slowDuration: 2000 },
        { damage: 12, range: 130, fireRate: 1000, color: '#44bbdd', slow: 0.5, slowDuration: 2500, buff1: true },
        { damage: 18, range: 150, fireRate: 900,  color: '#33ccff', slow: 0.6, slowDuration: 3000, buff2: true },
      ],
      upgradeCosts: [180, 480],
      projectileColor: '#55aacc',
      projectileSpeed: 6,

  ],

  // 动态生成波次（20波：第1波初始体送Buff，15个巨像随机分布，第10/20波Boss）
  TOTAL_WAVES: 20,
  GIANT_COUNT: 15,  // 普通巨像数量（随机分布到第2-20波）
  BOSS_WAVES: [10, 20],

  // 波次血量倍率函数（四段递进：+12%/+18%/+25%/+35%，第20波累计约49倍）
  getWaveHpMult(n) {
    if (n <= 1) return 1;
    if (n <= 5) return Math.pow(1.12, n - 1);
    if (n <= 10) return Math.pow(1.12, 4) * Math.pow(1.18, n - 5);
    if (n <= 15) return Math.pow(1.12, 4) * Math.pow(1.18, 5) * Math.pow(1.25, n - 10);
    return Math.pow(1.12, 4) * Math.pow(1.18, 5) * Math.pow(1.25, 5) * Math.pow(1.35, n - 15);
  },

  // 次数盾层数（按波次）
  getShieldStacks(waveNum) {
    if (waveNum < 5) return 0;
    if (waveNum <= 10) return 1;
    if (waveNum <= 15) return 2;
    return 3;
  },

  // 移速分阶段加快（防堵门：5-9波+25% / 10-14波+50% / 15-20波+80%）
  getSpeedMult(waveNum) {
    if (waveNum <= 4) return 1;
    if (waveNum <= 9) return 1.25;
    if (waveNum <= 14) return 1.50;
    return 1.80;
  },

  generateWaves() {
    // 15个巨像随机分配到第2-20波
    const giantSlots = [];
    for (let i = 0; i < this.GIANT_COUNT; i++) {
      giantSlots.push(rand(2, this.TOTAL_WAVES));
    }
    const giantPerWave = Array(this.TOTAL_WAVES + 1).fill(0);
    for (const w of giantSlots) giantPerWave[w]++;

    const waves = [];
    for (let w = 1; w <= this.TOTAL_WAVES; w++) {
      const wave = [];
      // 小怪随波次递增（删除重装/再生后，用原型补缺口，总数不变）
      let goblinCount = 8 + w * 2;
      if (w >= 4) goblinCount += 4 + Math.floor(w / 2);   // 原重装数量并入
      if (w >= 7) goblinCount += 2 + Math.floor(w / 4);   // 原再生数量并入
      wave.push({ type: 'goblin', count: goblinCount, interval: Math.max(350, 700 - w * 12) });
      if (w >= 2) wave.push({ type: 'bat', count: 4 + w, interval: 450 });
      // 第4波起：轻甲怪（减伤40%）
      if (w >= 4) wave.push({ type: 'lightarmored', count: 1 + Math.floor((w - 4) / 5), interval: 1200 });
      // 第8波起：重甲怪（减伤80%）
      if (w >= 8) wave.push({ type: 'armored', count: 2 + Math.floor((w - 7) / 2), interval: 1500 });
      // 第10波起：冲锋怪（随机3~5只，反堵门，逼纵深布局）
      if (w >= 10) wave.push({ type: 'charger', count: 3 + Math.floor(Math.random() * 3), interval: 1800 });

      // 第1波：必定1个初始体
      if (w === 1) {
        wave.push({ type: 'slowgiant', count: 1, interval: 3500 });
      }

      // 巨像随机分布
      for (let g = 0; g < giantPerWave[w]; g++) {
        wave.push({ type: 'giant', count: 1, interval: 2500 });
      }

      // Boss波（第10、20波）
      if (this.BOSS_WAVES.includes(w)) {
        wave.push({ type: 'boss', count: 1, interval: 5000 });
      }
      waves.push(wave);
    }
    // 日志
    const logParts = ['波1: 初始体'];
    for (let w = 2; w <= this.TOTAL_WAVES; w++) {
      if (giantPerWave[w] > 0) logParts.push(`波${w}: ${giantPerWave[w]}巨像`);
      if (this.BOSS_WAVES.includes(w)) logParts.push(`波${w}: BOSS`);
    }
    console.log('%c⚗ 波次: ' + logParts.join(' | '), 'color:#8cf;font-size:12px;');
    return { waves, giantSlots };
  },
};

// ==================== 游戏状态机 ====================
const GameState = {
  _state: 'MENU',
  _previous: null,
  _validTransitions: {
    'MENU':      ['PLAYING'],
    'PLAYING':   ['PAUSED', 'GAME_OVER', 'VICTORY', 'MENU'],
    'PAUSED':    ['PLAYING', 'MENU'],
    'GAME_OVER': ['MENU'],
    'VICTORY':   ['MENU'],
  },

  get state() { return this._state; },

  transition(newState) {
    const valid = this._validTransitions[this._state];
    if (!valid || !valid.includes(newState)) {
      TestLog.error('STATEMACHINE',
        `无效状态迁移: ${this._state} -> ${newState}。有效迁移: ${valid?.join(', ') || '无'}`);
      return false;
    }
    TestLog.info('STATEMACHINE', `状态迁移: ${this._state} -> ${newState}`);
    this._previous = this._state;
    this._state = newState;
    return true;
  },

  reset() { this._state = 'MENU'; this._previous = null; },
  getPrevious() { return this._previous; }
};

// ==================== 地图系统 ====================
const MapSystem = {
  grid: [],         // 2D: grid[row][col] = { type, tower }
  pathSet: new Set(),
  pathList: [],
  startPos: null,
  endPos: null,

  init() {
    this.grid = [];
    this.pathSet = new Set();

    // 初始化网格
    for (let r = 0; r < CONFIG.GRID_ROWS; r++) {
      this.grid[r] = [];
      for (let c = 0; c < CONFIG.GRID_COLS; c++) {
        this.grid[r][c] = { type: 'ground', tower: null };
      }
    }

    // 标记路径
    this.pathList = [...CONFIG.PATH];
    for (const p of CONFIG.PATH) {
      const key = `${p.x},${p.y}`;
      this.pathSet.add(key);
      if (this.grid[p.y] && this.grid[p.y][p.x]) {
        this.grid[p.y][p.x].type = 'path';
      }
    }

    this.startPos = CONFIG.PATH[0];
    this.endPos = CONFIG.PATH[CONFIG.PATH.length - 1];
    TestLog.info('MAP', `地图初始化完成: ${CONFIG.GRID_COLS}x${CONFIG.GRID_ROWS}, 路径长度: ${this.pathList.length}`);
  },

  isPath(col, row) {
    return this.pathSet.has(`${col},${row}`);
  },

  isBuildable(col, row) {
    if (col < 0 || col >= CONFIG.GRID_COLS || row < 0 || row >= CONFIG.GRID_ROWS) return false;
    if (this.isPath(col, row)) return false;
    const cell = this.grid[row]?.[col];
    if (!cell) return false;
    return cell.type === 'ground' && cell.tower === null;
  },

  canPlaceTower(col, row) {
    return this.isBuildable(col, row);
  },

  placeTower(col, row, tower) {
    if (!this.canPlaceTower(col, row)) {
      TestLog.warn('MAP', `无法在 (${col},${row}) 放置塔`);
      return false;
    }
    this.grid[row][col].tower = tower;
    this.grid[row][col].type = 'tower';
    TestLog.info('MAP', `塔已放置: (${col},${row}), 类型: ${tower.type}`);
    return true;
  },

  removeTower(col, row) {
    const cell = this.grid[row]?.[col];
    if (!cell || !cell.tower) {
      TestLog.warn('MAP', `在 (${col},${row}) 未找到塔`);
      return null;
    }
    const tower = cell.tower;
    cell.tower = null;
    cell.type = 'ground';
    TestLog.info('MAP', `塔已移除: (${col},${row}), 类型: ${tower.type}`);
    return tower;
  },

  screenToGrid(sx, sy) {
    const col = Math.floor(sx / CONFIG.TILE_SIZE);
    const row = Math.floor(sy / CONFIG.TILE_SIZE);
    return { col, row };
  },

  getTowerAt(col, row) {
    return this.grid[row]?.[col]?.tower || null;
  },

  reset() {
    for (let r = 0; r < CONFIG.GRID_ROWS; r++) {
      for (let c = 0; c < CONFIG.GRID_COLS; c++) {
        if (this.grid[r][c].type === 'tower') {
          this.grid[r][c].tower = null;
          this.grid[r][c].type = 'ground';
        }
      }
    }
  }
};

// ==================== 塔系统 ====================
const TowerSystem = {
  towers: [],  // 所有已放置的塔
  nextId: 1,

  create(typeId, col, row) {
    const typeDef = CONFIG.TOWER_TYPES[typeId];
    if (!typeDef) {
      TestLog.error('TOWER', `无效塔类型: ${typeId}`);
      return null;
    }
    if (!MapSystem.canPlaceTower(col, row)) {
      TestLog.warn('TOWER', `无法放置 ${typeId} 在 (${col},${row})`);
      return null;
    }
    // 波次进行中：无法临时增加装置
    if (WaveManager.waveActive) {
      TestLog.warn('TOWER', '波次进行中，无法增加装置');
      UI.showToast('波次进行中，无法增加装置');
      return null;
    }
    // 装置限制：同类型最多6个，总数最多24个
    const sameTypeCount = this.towers.filter(t => t.type === typeId).length;
    if (sameTypeCount >= 6) {
      TestLog.warn('TOWER', `同类型装置最多6个，当前已有 ${sameTypeCount} 个`);
      UI.showToast('同类型装置最多放置6个');
      return null;
    }
    if (this.towers.length >= 24) {
      TestLog.warn('TOWER', '场上装置已达上限24个');
      UI.showToast('场上装置已达上限24个');
      return null;
    }

    const tower = {
      id: this.nextId++,
      type: typeId,
      typeDef: typeDef,
      col, row,
      level: 0,  // 0, 1, 2
      lastFireTime: 0,
      target: null,
      angle: 0,
      x: col * CONFIG.TILE_SIZE + CONFIG.TILE_SIZE / 2,
      y: row * CONFIG.TILE_SIZE + CONFIG.TILE_SIZE / 2,
      // 钉枪强化buff状态（淬火：连续命中叠层，最多3层）
      hitStreak: 0,        // 淬火叠层（0-3）
      lastHitTime: 0,      // 上次命中时间
      tempSpeedBonus: false, // 未命中后的临时攻速加成（下一击+50%攻速）
      // 电弧强化buff状态
      attackSpeedStacks: 0,  // 满载攻速叠层（0-2）
      attackCount: 0,        // 攻击计数
      lastMagnetTime: -9999, // 超载磁暴上次触发时间（3s冷却）
      // 矩阵追击开关
      pursuitMode: false,    // 追击模式（默认关闭，Lv3后需手动开启）
    };

    MapSystem.placeTower(col, row, tower);
    this.towers.push(tower);
    TestLog.info('TOWER', `创建 ${typeId} 塔 #${tower.id} 级别 ${tower.level} 在 (${col},${row})`);
    return tower;
  },

  getStats(tower) {
    return tower.typeDef.levels[tower.level];
  },

  upgrade(tower) {
    if (tower.level >= 2) {
      TestLog.warn('TOWER', `塔 #${tower.id} 已达最高级别`);
      return false;
    }
    // 电弧3级解锁条件：需要2座其他不同种类的3级塔
    if (tower.type === 'magic' && tower.level === 1) {
      const lv3Types = new Set();
      for (const t of this.towers) {
        if (t.level === 2 && t.type !== 'magic') lv3Types.add(t.type);
      }
      if (lv3Types.size < 2) {
        TestLog.warn('TOWER', `电弧升级被锁定：需要2座不同种类的3级塔，当前只有 ${lv3Types.size} 种`);
        UI.showToast('🔒 电弧3级需要2座不同种类的3级塔');
        return false;
      }
    }
    const cost = tower.typeDef.upgradeCosts[tower.level];
    if (Economy.gold < cost) {
      TestLog.warn('TOWER', `金币不足升级塔 #${tower.id}: 需要 ${cost}, 当前 ${Economy.gold}`);
      return false;
    }
    Economy.spend(cost);
    tower.level++;
    TestLog.info('TOWER', `塔 #${tower.id} 升级到 ${tower.level} 级, 花费 ${cost} 金币`);
    return true;
  },

  sell(tower) {
    const totalCost = tower.typeDef.cost +
      (tower.level > 0 ? tower.typeDef.upgradeCosts[0] : 0) +
      (tower.level > 1 ? tower.typeDef.upgradeCosts[1] : 0);
    const refund = totalCost;
    MapSystem.removeTower(tower.col, tower.row);
    this.towers = this.towers.filter(t => t.id !== tower.id);
    Economy.earn(refund);
    TestLog.info('TOWER', `出售塔 #${tower.id}, 返还 ${refund} 金币`);
    return refund;
  },

  findTarget(tower, enemies, now, range) {
    let best = null;
    let bestProgress = -1;

    for (const enemy of enemies) {
      if (enemy.dead || enemy.reached) continue;
      // 飞行敌人只能被钉枪和电弧攻击
      if (enemy.typeDef?.flying && tower.type !== 'archer' && tower.type !== 'magic') continue;

      const d = dist(tower.x, tower.y, enemy.x, enemy.y);
      if (d <= range) {
        // 优先攻击沿路径走得最远的
        const progress = enemy.pathIndex;
        if (progress > bestProgress || (progress === bestProgress && d < (best ? dist(tower.x, tower.y, best.x, best.y) : Infinity))) {
          bestProgress = progress;
          best = enemy;
        }
      }
    }
    return best;
  },

  // 云端服务：Lv3矩阵九宫格(3x3)内所有装置（含矩阵自身）+30%伤害 +30范围 +20%攻速（不可叠加，取一份）
  getCannonBuff(tower) {
    for (const c of this.towers) {
      if (c.type !== 'cannon' || c.level < 2) continue;
      if (Math.abs(c.col - tower.col) <= 1 && Math.abs(c.row - tower.row) <= 1) {
        return { dmgBonus: 0.30, rangeBonus: 30, atkSpeedBonus: 0.20 };
      }
    }
    return null;
  },

  // 电弧满载：周围(3x3)的3级装备数量（含自身），每多1个+20%基础面板伤害，最多100%
  countNearbyLv3(tower) {
    let count = 0;
    for (const t of this.towers) {
      if (t.level === 2 && Math.abs(t.col - tower.col) <= 1 && Math.abs(t.row - tower.row) <= 1) {
        count++;
      }
    }
    return count;
  },

  update(enemies, now, projectileSys) {
    for (const tower of this.towers) {
      const baseStats = this.getStats(tower);
      let effectiveFireRate = BuffSystem.getEffectiveFireRate(baseStats.fireRate);
      let effectiveDamage = BuffSystem.getEffectiveDamage(baseStats.damage);
      let effectiveRange = baseStats.range;

      // ===== 钉枪淬火：命中叠层(+10%攻速+10伤) + 未命中临时攻速 =====
      if (tower.type === 'archer' && tower.level >= 1) {
        if (tower.hitStreak > 0) {
          effectiveFireRate = Math.floor(effectiveFireRate / (1 + tower.hitStreak * 0.10));
          effectiveDamage += tower.hitStreak * 10;
        }
        // 未命中后的临时攻速：下一击+50%攻速
        if (tower.tempSpeedBonus) {
          effectiveFireRate = Math.floor(effectiveFireRate / 1.5);
        }
      }

      // ===== 电弧满载：攻速叠层 + 周边3级装备+20%伤害(最多100%) =====
      if (tower.type === 'magic' && tower.level >= 1) {
        if (tower.attackSpeedStacks > 0) {
          effectiveFireRate = Math.floor(effectiveFireRate / (1 + tower.attackSpeedStacks * 0.10));
        }
        const nearbyLv3 = this.countNearbyLv3(tower);
        const dmgBonus = Math.min(nearbyLv3 * 0.20, 1.0);
        if (dmgBonus > 0) effectiveDamage = Math.floor(effectiveDamage * (1 + dmgBonus));
      }

      // ===== 矩阵云端服务：九宫格内 +30%伤害 +30范围 +20%攻速 =====
      const cannonBuff = this.getCannonBuff(tower);
      if (cannonBuff) {
        effectiveDamage = Math.floor(effectiveDamage * (1 + cannonBuff.dmgBonus));
        effectiveRange += cannonBuff.rangeBonus;
        effectiveFireRate = Math.floor(effectiveFireRate / (1 + cannonBuff.atkSpeedBonus));
      }

      // ===== 矩阵自身：Lv3后自动攻击攻速降为原40%（间隔×2.5） =====
      if (tower.type === 'cannon' && tower.level >= 2) {
        effectiveFireRate = Math.floor(effectiveFireRate / 0.4);
      }

      const stats = {
        ...baseStats,
        damage: effectiveDamage,
        fireRate: effectiveFireRate,
        range: effectiveRange,
        cloudBuff: !!cannonBuff,                                        // 吃到云端服务
        magicLoaded: (tower.type === 'magic' && tower.level >= 1),       // 满载
        magicOverload: (tower.type === 'magic' && tower.level >= 2),     // 超载
      };

      if (now - tower.lastFireTime < effectiveFireRate) continue;

      const target = this.findTarget(tower, enemies, now, effectiveRange);
      if (target) {
        tower.lastFireTime = now;
        tower.angle = Math.atan2(target.y - tower.y, target.x - tower.x);
        tower.target = target;

        // 电弧：攻击计数 + 满载攻速叠层
        if (tower.type === 'magic') {
          tower.attackCount++;
          tower.attackSpeedStacks = Math.min(tower.attackSpeedStacks + 1, 2);
        }

        TestLog.info('TOWER', `${tower.typeDef.name} #${tower.id} 攻击 ${target.typeDef.name}, 伤害=${stats.damage}`);

        // 发射弹丸
        if (tower.type === 'magic') {
          projectileSys.add(tower, target, 'chain', stats);
          // 超载磁暴（Lv3，3s冷却）
          if (tower.level >= 2 && now - tower.lastMagnetTime >= 3000) {
            tower.lastMagnetTime = now;
            const magnetDmg = stats.damage + Math.floor(baseStats.fireRate * 0.10);
            projectileSys.add(tower, target, 'magnet', { ...stats, damage: magnetDmg });
          }
        } else if (tower.type === 'cannon') {
          projectileSys.add(tower, target, 'aoe', stats);
        } else {
          projectileSys.add(tower, target, 'normal', stats);
        }
      }
    }
  },

  reset() {
    this.towers = [];
    this.nextId = 1;
  }
};

// ==================== 弹丸系统 ====================
const ProjectileSystem = {
  projectiles: [],

  add(tower, target, mode, stats) {
    this.projectiles.push({
      x: tower.x, y: tower.y,
      target: target,
      targetX: target.x, targetY: target.y,
      speed: tower.typeDef.projectileSpeed,
      color: tower.typeDef.projectileColor,
      damage: stats.damage,
      mode: mode,
      stats: stats,
      towerType: tower.type,
      towerId: tower.id,
      towerLevel: tower.level,
      alive: true,
      chainedTargets: new Set(),
    });
  },

  update(delta, enemies, now) {
    // 弹丸移动
    for (const p of this.projectiles) {
      if (!p.alive) continue;
      if (p.target && !p.target.dead) {
        p.targetX = p.target.x;
        p.targetY = p.target.y;
      }
      const dx = p.targetX - p.x;
      const dy = p.targetY - p.y;
      const d = Math.sqrt(dx * dx + dy * dy);
      if (d < 8) {
        this.onHit(p, enemies);
        p.alive = false;
      } else {
        // 弹丸移动（乘 delta 标准化，倍速下同步加速）
        const step = p.speed * delta / 16.67;
        p.x += (dx / d) * step;
        p.y += (dy / d) * step;
      }
    }
    this.projectiles = this.projectiles.filter(p => p.alive);
  },

  onHit(p, enemies) {
    if (p.mode === 'normal') {
      // 单体伤害（钉枪/液氮）
      if (p.target && !p.target.dead) {
        if (p.towerType === 'ice') {
          // 液氮：冻伤/冻结/破甲（Lv2辅助）或低温日混合伤害（Lv3输出），含基础减速
          this.applyIceDebuff(p);
        } else if (p.towerType === 'archer') {
          // 钉枪：伤害 + 淬火 + 锈蚀/链式反应
          const didDamage = Combat.dealDamage(p.target, p.damage, 'archer');
          this.applyQuench(p, didDamage);
          if (p.towerLevel >= 2) this.applyRust(p, didDamage);
        } else {
          Combat.dealDamage(p.target, p.damage, p.towerType);
        }
      }
    } else if (p.mode === 'magnet') {
      // 电弧超载磁暴：单体（伤害已在发射时算好 = 自身伤害100% + 攻速ms×10%）
      if (p.target && !p.target.dead) {
        Combat.dealDamage(p.target, p.damage, p.towerType);
      }
    } else if (p.mode === 'aoe') {
      // 矩阵AOE（Lv1/Lv2/Lv3）
      const aoeRange = p.stats.aoe || 50;
      for (const enemy of enemies) {
        if (enemy.dead) continue;
        const d = dist(p.targetX, p.targetY, enemy.x, enemy.y);
        if (d <= aoeRange) {
          Combat.dealDamage(enemy, p.damage, p.towerType);
        }
      }
      // 主要目标额外受伤害
      if (p.target && !p.target.dead) {
        Combat.dealDamage(p.target, Math.floor(p.damage * 0.3), p.towerType);
      }
    } else if (p.mode === 'chain') {
      // 电弧弹射
      this.doChain(p, enemies);
    }
  },

  // 电弧弹射：A(100%) → B(70%×1.05满载) → C(B×70%) → D(共振=A等额)；超载真伤
  doChain(p, enemies) {
    const chainCount = p.stats.chain || 2;
    const loaded = p.stats.magicLoaded;       // 满载：弹射+5%、无视15%减伤
    const overload = p.stats.magicOverload;   // 超载：共振+真伤+单怪弹射
    const bounceMult = loaded ? 0.70 * 1.05 : 0.70;

    const aliveCount = enemies.filter(e => !e.dead && !e.reached).length;
    const solo = overload && aliveCount === 1;

    const chained = new Set();
    chained.add(p.target);
    Combat.dealDamage(p.target, p.damage, p.towerType);
    if (overload) {
      const pct = solo ? 0.05 : 0.02; // 单怪5%真伤，群怪2%真伤
      Combat.dealTrueDamage(p.target, Math.max(1, Math.floor(p.target.hp * pct)));
    }

    let current = p.target;
    let prevDmg = p.damage;
    // chain 为目标总数：首击A + (chain-1) 次弹射
    for (let i = 0; i < chainCount - 1; i++) {
      let nearest = null;
      let nearestDist = 120;
      for (const enemy of enemies) {
        if (enemy.dead || chained.has(enemy)) continue;
        const d = dist(current.x, current.y, enemy.x, enemy.y);
        if (d < nearestDist) { nearestDist = d; nearest = enemy; }
      }
      if (nearest) {
        let chainDmg;
        if (overload && i === chainCount - 2) {
          chainDmg = p.damage; // 末跳·共振：A目标等额伤害（连锁4目标时第4跳）
        } else {
          chainDmg = Math.floor(prevDmg * bounceMult);
        }
        const opts = loaded ? { armorPenetration: 0.15 } : {}; // 满载弹射无视15%减伤
        Combat.dealDamage(nearest, Math.max(1, chainDmg), p.towerType, opts);
        if (overload) {
          Combat.dealTrueDamage(nearest, Math.max(1, Math.floor(nearest.hp * 0.02)));
        }
        // 超载：进行两次弹射后，降低中间单位（A→B→C中的B）15%减伤（30s，只对其他装置生效）
        if (overload && i === 1 && current && !current.dead) {
          current.arcArmorReduce = 0.15;
          current.arcArmorReduceUntil = GameLoop.gameTime + 30000;
          TestLog.info('MAGIC', `⚡ ${current.typeDef?.name} 减伤-15%（30s，独立乘区）`);
        }
        prevDmg = chainDmg;
        chained.add(nearest);
        current = nearest;
      } else {
        break;
      }
    }

    // 超载：场上仅1怪时，独立弹射2次（替代群怪连锁），附5%/2%真伤
    if (solo && p.target && !p.target.dead) {
      let soloDmg = Math.floor(p.damage * bounceMult);
      Combat.dealDamage(p.target, Math.max(1, soloDmg), p.towerType);
      Combat.dealTrueDamage(p.target, Math.max(1, Math.floor(p.target.hp * 0.05)));
      soloDmg = Math.floor(soloDmg * bounceMult);
      Combat.dealDamage(p.target, Math.max(1, soloDmg), p.towerType);
      Combat.dealTrueDamage(p.target, Math.max(1, Math.floor(p.target.hp * 0.02)));
    }
  },

  // 钉枪淬火：命中造成伤害→叠层(+10%攻速+10伤)；未造成伤害→下一击+50%临时攻速
  applyQuench(p, didDamage) {
    const tower = TowerSystem.towers.find(t => t.id === p.towerId);
    if (!tower) return;
    const maxStreak = tower.level >= 2 ? 3 : 2; // Lv3淬火叠3层
    if (didDamage) {
      tower.hitStreak = Math.min(tower.hitStreak + 1, maxStreak);
      tower.tempSpeedBonus = false;
      tower.lastHitTime = GameLoop.gameTime;
    } else {
      tower.tempSpeedBonus = true;
      tower.hitStreak = 0;
    }
  },

  // 钉枪锈蚀：每5次命中叠1层（最多3层）；叠满3层后每8次命中触发链式反应
  applyRust(p, didDamage) {
    if (!didDamage) return;
    const enemy = p.target;
    if (!enemy || enemy.dead) return;

    if (enemy.rustStacks < 3) {
      enemy.rustHits = (enemy.rustHits || 0) + 1;
      if (enemy.rustHits % 5 === 0) {
        enemy.rustStacks++;
        TestLog.info('RUST', `${enemy.typeDef?.name} 锈蚀 ${enemy.rustStacks}层（易伤+${Math.min(enemy.rustStacks, 3) * 5}%）`);
      }
    } else {
      enemy.chainHits = (enemy.chainHits || 0) + 1;
      if (enemy.chainHits % 8 === 0) {
        const atkSpeed = 1000 / p.stats.fireRate; // 每秒攻击次数
        const chainDmg = Math.floor(atkSpeed * 60 + p.stats.damage * 1.0); // 攻速×60 + 伤害×100%
        Combat.dealDamage(enemy, chainDmg, 'archer');
        TestLog.info('RUST', `⚡ 链式反应! ${enemy.typeDef?.name} 受${chainDmg}额外伤害`);
      }
    }
  },

  // 液氮：基础减速 + 冻伤/冻结/破甲（Lv2辅助）或低温日混合伤害（Lv3输出）
  applyIceDebuff(p) {
    const enemy = p.target;
    if (!enemy || enemy.dead) return;

    // 基础减速（面板slow，Boss减半）
    if (p.stats.slow && !enemy.typeDef?.isBoss) {
      Combat.applyBaseSlow(enemy, p.stats.slow, p.stats.slowDuration);
    }

    if (p.towerLevel >= 2) {
      // Lv3 低温日（输出路线）：混合伤害 = 伤害×200% + 当前生命3%（受护甲减伤）
      const mixedDmg = Math.floor(p.stats.damage * 2 + enemy.hp * 0.03);
      Combat.dealDamage(enemy, mixedDmg, 'ice');
      return;
    }

    // Lv1/Lv2：普通伤害
    Combat.dealDamage(enemy, p.damage, 'ice');

    // Lv2 冻伤（辅助路线）：叠3层→冻结1.5s + 破甲-20%/层（最多60%）；定身后2s免疫
    if (p.towerLevel >= 1 && !enemy.frozen && !enemy.typeDef?.isBoss && enemy.frozenImmuneUntil <= GameLoop.gameTime) {
      enemy.freezeStacks = Math.min(enemy.freezeStacks + 1, 3);
      if (enemy.freezeStacks >= 3) {
        enemy.frozen = true;
        enemy.frozenUntil = GameLoop.gameTime + 1500;
        enemy.freezeStacks = 0;
        enemy.armorBreak = Math.min((enemy.armorBreak || 0) + 0.20, 0.60);
        TestLog.info('ICE', `❄️ ${enemy.typeDef?.name} 冻结1.5s + 破甲${(enemy.armorBreak * 100).toFixed(0)}%`);
      }
    }
  },

  reset() {
    this.projectiles = [];
  }
};

// ==================== Buff 系统 ====================
const BuffSystem = {
  active: false,
  type: null,          // 'power' (初始体掉落) | 'bounty' (赏金Buff)
  remainingWaves: 0,   // 剩余波次数
  damageMult: 1,       // 伤害倍率
  fireRateMult: 1,     // 攻速倍率（越大越快，实际除以fireRate）
  goldBonusPerKill: 0, // 每杀额外金币

  // 初始体掉落：强力Buff（攻速x1.5 伤害x1.5，持续到第2波结束；无金币加成）
  activatePower() {
    this.active = true;
    this.type = 'power';
    this.remainingWaves = 2;  // 第1波结束-1，第2波结束-1→过期
    this.damageMult = 1.5;
    this.fireRateMult = 1.5;
    this.goldBonusPerKill = 0;
    TestLog.info('BUFF', '🌟 强力Buff激活! 攻速x1.5 伤害x1.5 持续至第二波结束');
    UI.showToast('🌟 获得强力Buff！攻速↑ 伤害1.5x');
  },

  // 赏金Buff（5波一组，第4波结束触发，持续整个第5波）
  activateBounty() {
    this.active = true;
    this.type = 'bounty';
    this.remainingWaves = 1;  // 第5波结束-1→过期
    this.damageMult = 1;
    this.fireRateMult = 1;
    this.goldBonusPerKill = 10;
    TestLog.info('BUFF', '💰 赏金Buff激活! 额外+20金币/击杀 持续整个第5波');
    UI.showToast('💰 获得赏金Buff！击杀额外+20金币（持续下一波）');
  },

  // 每次击杀调用，返回额外金币
  onKill() {
    if (!this.active) return 0;
    return this.goldBonusPerKill;
  },

  // 波次完成时调用，减少剩余波次
  onWaveComplete() {
    if (!this.active) return;
    this.remainingWaves--;
    if (this.remainingWaves <= 0) {
      const wasPower = this.type === 'power';
      this.active = false;
      this.damageMult = 1;
      this.fireRateMult = 1;
      this.goldBonusPerKill = 0;
      TestLog.info('BUFF', `${wasPower ? '强力Buff' : '赏金Buff'}已过期`);
      UI.showToast(`${wasPower ? '强力Buff' : '赏金Buff'}已过期`);
    } else {
      TestLog.info('BUFF', `Buff剩余 ${this.remainingWaves} 波`);
    }
  },

  getEffectiveFireRate(baseRate) {
    if (!this.active || this.type !== 'power') return baseRate;
    return Math.floor(baseRate / this.fireRateMult);
  },

  getEffectiveDamage(baseDamage) {
    if (!this.active || this.type !== 'power') return baseDamage;
    return Math.floor(baseDamage * this.damageMult);
  },

  reset() {
    this.active = false;
    this.type = null;
    this.remainingWaves = 0;
    this.damageMult = 1;
    this.fireRateMult = 1;
    this.goldBonusPerKill = 0;
  },

  getStatusText() {
    if (!this.active) return '';
    if (this.type === 'power') return `🌟 强力Buff(攻速x1.5 伤害x1.5)`;
    return `💰 赏金Buff(+${this.goldBonusPerKill}金币/击杀)`;
  }
};

// ==================== 敌人分裂系统 ====================
const SplitSystem = {
  splitEnemy(giant) {
    // 找到巨人死亡位置最近的路径点
    let nearestPathIdx = 0;
    let nearestDist = Infinity;
    for (let i = 0; i < CONFIG.PATH.length; i++) {
      const px = CONFIG.PATH[i].x * CONFIG.TILE_SIZE + CONFIG.TILE_SIZE / 2;
      const py = CONFIG.PATH[i].y * CONFIG.TILE_SIZE + CONFIG.TILE_SIZE / 2;
      const d = dist(giant.x, giant.y, px, py);
      if (d < nearestDist) {
        nearestDist = d;
        nearestPathIdx = i;
      }
    }

    // 生成分裂小怪
    const miniType = giant.typeDef.splitType || 'minigoblin';
    const splitCount = giant.typeDef.splitCount || 3;
    const waveNum = WaveManager.currentWave;

    TestLog.info('SPLIT', `巨人 #${giant.id} 死亡! 即将分裂 ${splitCount} 个 ${miniType}`);

    for (let i = 0; i < splitCount; i++) {
      const offsetX = randf(-25, 25);
      const offsetY = randf(-25, 25);
      const mini = EnemySystem.createAtPosition(
        miniType, waveNum,
        giant.x + offsetX, giant.y + offsetY,
        nearestPathIdx, true
      );
      if (!mini) {
        TestLog.error('SPLIT', `分裂失败: 类型 ${miniType} 不存在于 ENEMY_TYPES`);
      }
    }
  }
};

// ==================== 战斗系统 ====================
const Combat = {
  // 计算有效减伤（重甲护甲 - 液氮破甲(减法) - 电弧降减伤(独立乘区，只对其他装置生效)）
  getEffectiveArmor(enemy, towerType) {
    let armor = enemy.armor || 0;
    if (armor <= 0) return 0;
    if (enemy.armorBreak) armor = Math.max(0, armor - enemy.armorBreak); // 破甲：减法
    // 电弧降减伤：独立乘区，只对非电弧装置生效，30s有效
    if (enemy.arcArmorReduce && enemy.arcArmorReduceUntil > GameLoop.gameTime && towerType !== 'magic') {
      armor = armor * (1 - enemy.arcArmorReduce);
    }
    return Math.max(0, armor);
  },

  // 真实伤害：不参与减伤计算
  dealTrueDamage(enemy, amount) {
    if (enemy.dead) return;
    enemy.hp -= amount;
    TestLog.info('COMBAT', `${enemy.typeDef?.name || '敌人'} 受到 ${amount} 点真实伤害, 剩余HP: ${enemy.hp}`);
    this.checkDeath(enemy, 'true');
  },

  // 主伤害结算，返回是否造成实际伤害（>0）
  dealDamage(enemy, amount, towerType, opts = {}) {
    if (enemy.dead) return false;

    // 受击计数 + 矩阵追击检查（追击自身不计数）
    if (!opts.noHitCount) {
      enemy.hitCount = (enemy.hitCount || 0) + 1;
      this.checkPursuit(enemy, towerType);
    }

    // 冲锋怪：无次数盾，受击3次进入冲锋状态（移速提升+易伤）
    if (enemy.typeDef?.isCharger && !enemy.chargeState && (enemy.hitCount || 0) >= (enemy.typeDef.chargeTriggerHits || 3)) {
      enemy.chargeState = true;
      TestLog.info('CHARGER', `💨 ${enemy.typeDef?.name} 受击${enemy.typeDef.chargeTriggerHits || 3}次，进入冲锋状态！移速提升、受到伤害+10%`);
    }
    // 第10波Boss：受击3次后冲锋（移速上限1.0，不加易伤）
    if (enemy.bossCharges && !enemy.chargeState && (enemy.hitCount || 0) >= 3) {
      enemy.chargeState = true;
      TestLog.info('BOSS', `🏃 ${enemy.typeDef?.name} 受击3次，进入冲锋状态！移速上限1.0`);
    }

    // 次数盾：有盾时伤害归0，消耗1层盾；最后一层破掉后0.5s无敌
    if (enemy.shieldStacks > 0 && !opts.ignoreShield) {
      enemy.shieldStacks--;
      if (enemy.shieldStacks === 0) {
        enemy.invulnUntil = GameLoop.gameTime + 500; // 破盾后0.5s无敌
      }
      TestLog.info('SHIELD', `${enemy.typeDef?.name || '敌人'} 护盾抵挡本次伤害，剩余 ${enemy.shieldStacks} 层`);
      return false;
    }

    // 血牛Boss：盾打光后，每受10次攻击刷新4层盾（电弧弹射只算1次，在弹射层处理）
    if (enemy.isShieldBoss && !opts.ignoreShield) {
      enemy.shieldRefreshHits++;
      if (enemy.shieldRefreshHits >= 10) {
        enemy.shieldRefreshHits = 0;
        enemy.shieldStacks = 4;
        TestLog.info('SHIELD', `🛡️ 血牛Boss刷新4层护盾`);
      }
    }

    // 破盾后0.5s无敌：期间伤害归0
    if (enemy.invulnUntil > GameLoop.gameTime && !opts.ignoreInvuln) {
      return false;
    }

    let actualDamage = amount;

    // 减伤（重甲怪护甲 - 破甲 - 降减伤）；电弧满载弹射无视15%减伤
    if (!opts.trueDamage && enemy.armor > 0) {
      let effArmor = this.getEffectiveArmor(enemy, towerType);
      if (opts.armorPenetration) effArmor = effArmor * (1 - opts.armorPenetration);
      if (effArmor > 0) actualDamage = Math.floor(actualDamage * (1 - effArmor));
    }

    // 易伤：锈蚀（+5%/层，封顶3层=+15%，只对除钉枪外的武器生效；追击独立结算不吃易伤）+ 冲锋状态+10%
    let vulnMult = 1;
    if (!opts.ignoreVuln && enemy.rustStacks > 0 && towerType !== 'archer') {
      vulnMult += Math.min(enemy.rustStacks, 3) * 0.05;
    }
    if (enemy.typeDef?.isCharger && enemy.chargeState) {
      vulnMult += 0.10; // 冲锋状态：受到伤害+10%
    }
    if (vulnMult > 1) actualDamage = Math.floor(actualDamage * vulnMult);

    enemy.hp -= actualDamage;
    TestLog.info('COMBAT', `${enemy.typeDef?.name || '敌人'} 受到 ${actualDamage} 点伤害 (${towerType}), 剩余HP: ${enemy.hp}`);

    if (enemy.hp <= 0) {
      this.checkDeath(enemy, towerType);
    }
    return actualDamage > 0;
  },

  // 死亡结算
  checkDeath(enemy, towerType) {
    if (enemy.dead) return;
    enemy.hp = 0;
    enemy.dead = true;

    const buffBonus = BuffSystem.onKill();
    const baseGold = enemy.goldReward + buffBonus;
    Economy.earn(baseGold);
    Stats.kills++;
    Stats.totalGoldEarned += baseGold;

    TestLog.info('COMBAT', `${enemy.typeDef?.name || '敌人'} 被击杀, 获得 ${baseGold} 金币${buffBonus ? ' (含Buff)' : ''}`);

    if (enemy.typeDef?.isGiant) {
      SplitSystem.splitEnemy(enemy);
    }
  },

  // 矩阵追击（云端服务）：怪物每被攻击2次，开启追击的矩阵对其造成120混合伤害（0.6s冷却，独立结算）
  checkPursuit(enemy, sourceTowerType) {
    if (enemy.dead) return;
    if ((enemy.hitCount || 0) % 2 !== 0) return;      // 每2次攻击触发
    if (sourceTowerType === 'cannon') return;          // 矩阵自身攻击不触发追击
    const now = GameLoop.gameTime;
    if (now - (enemy.lastPursuitTime || -9999) < 600) return; // 0.6s冷却

    const ex = Math.floor(enemy.x / CONFIG.TILE_SIZE);
    const ey = Math.floor(enemy.y / CONFIG.TILE_SIZE);
    for (const t of TowerSystem.towers) {
      if (t.type !== 'cannon' || t.level < 2 || !t.pursuitMode) continue;
      if (Math.abs(t.col - ex) <= 1 && Math.abs(t.row - ey) <= 1) {
        enemy.lastPursuitTime = now;
        // 追击120：固定值，独立结算（不吃易伤），受护甲减伤
        this.dealDamage(enemy, 120, 'cannon', { noHitCount: true, ignoreVuln: true });
        TestLog.info('PURSUIT', `📡 ${enemy.typeDef?.name} 被矩阵追击120伤害`);
        break;
      }
    }
  },

  // 施加液氮基础减速（乘法叠加的基础减速因子）
  applyBaseSlow(enemy, slow, duration) {
    if (enemy.typeDef?.isBoss) {
      slow = 1 - (1 - slow) * 0.5;
      duration = duration * 0.5;
    }
    enemy.baseSlowFactor = slow;
    enemy.baseSlowUntil = GameLoop.gameTime + duration;
  },
};

// ==================== 经济系统 ====================
const Economy = {
  gold: 0,

  init(startGold) {
    this.gold = startGold;
    TestLog.info('ECONOMY', `经济初始化: ${startGold} 金币`);
  },

  earn(amount) {
    if (amount <= 0) return 0;
    const mult = CONFIG.DIFFICULTY[Settings.difficulty].goldMult;
    const earned = Math.floor(amount * mult);
    this.gold += earned;

    // 成就检查
    if (this.gold >= 1000) AchievementSystem.unlock('rich');
    if (this.gold >= 2000) AchievementSystem.unlock('wealthy');

    return earned;
  },

  spend(amount) {
    if (amount <= 0) {
      TestLog.warn('ECONOMY', `无效花费: ${amount}`);
      return false;
    }
    if (this.gold < amount) {
      TestLog.warn('ECONOMY', `金币不足: 需要 ${amount}, 当前 ${this.gold}`);
      return false;
    }
    this.gold -= amount;
    TestLog.info('ECONOMY', `花费 ${amount} 金币, 剩余 ${this.gold}`);
    return true;
  },

  canAfford(amount) {
    return this.gold >= amount;
  },

  reset() {
    this.gold = 0;
  }
};

// ==================== 敌人系统 ====================
const EnemySystem = {
  enemies: [],
  nextId: 1,

  create(typeId, waveNum) {
    const typeDef = CONFIG.ENEMY_TYPES[typeId];
    if (!typeDef) {
      TestLog.error('ENEMY', `无效敌人类型: ${typeId}`);
      return null;
    }

    const diff = CONFIG.DIFFICULTY[Settings.difficulty];
    const waveMult = CONFIG.getWaveHpMult(waveNum);

    // Boss 血量独立设计（第10波 10000 / 第20波 130000 + 4层盾；减伤分波：第10波50% / 第20波80%）
    let baseHp;
    let shieldStacks;
    let isShieldBoss = false;
    let bossArmor = 0;
    let bossSpeed = 0;       // Boss面板移速（第10波0.5 / 第20波1.2）
    let bossCharges = false; // 第10波Boss有冲锋机制（受击3次后加速，上限1.0）
    if (typeDef.isBoss) {
      if (waveNum >= 20) {
        baseHp = 130000;   // 第20波纯血牛Boss
        shieldStacks = 4;  // 初始4层盾
        isShieldBoss = true;
        bossArmor = 0.8;   // 第20波Boss 80%减伤
        bossSpeed = 1.2;   // 第20波Boss 原始移速
      } else {
        baseHp = 10000;    // 第10波Boss
        shieldStacks = 0;
        bossArmor = 0.5;   // 第10波Boss 50%减伤
        bossSpeed = 0.5;   // 第10波Boss 慢速
        bossCharges = true;
      }
    } else if (typeDef.isCharger) {
      baseHp = Math.floor(typeDef.hp * diff.hpMult * waveMult);
      shieldStacks = 0; // 冲锋怪无次数盾，改为受击3次触发冲锋
    } else {
      baseHp = Math.floor(typeDef.hp * diff.hpMult * waveMult);
      shieldStacks = CONFIG.getShieldStacks(waveNum);
    }

    const startPos = MapSystem.startPos;
    const enemy = {
      id: this.nextId++,
      type: typeId,
      typeDef: typeDef,
      x: startPos.x * CONFIG.TILE_SIZE + CONFIG.TILE_SIZE / 2,
      y: startPos.y * CONFIG.TILE_SIZE + CONFIG.TILE_SIZE / 2,
      maxHp: baseHp,
      hp: baseHp,
      shieldStacks: shieldStacks,  // 次数盾层数
      shieldRefreshHits: 0,        // 盾打光后受击计数（血牛Boss）
      isShieldBoss: isShieldBoss,  // 是否第20波血牛Boss
      baseSpeed: (typeDef.isBoss ? bossSpeed : typeDef.speed) * diff.speedMult * CONFIG.getSpeedMult(waveNum),
      speedMult: 1.0,
      speed: (typeDef.isBoss ? bossSpeed : typeDef.speed) * diff.speedMult * CONFIG.getSpeedMult(waveNum),
      slowUntil: 0,
      goldReward: typeDef.gold,
      pathIndex: 0,
      dead: false,
      reached: false,
      size: typeDef.size,
      color: typeDef.color,
      flying: typeDef.flying || false,
      isBoss: typeDef.isBoss || false, isCharger: typeDef.isCharger || false,
      regen: typeDef.regen || 0,
      // v3.0 debuff 状态
      rustStacks: 0,      // 锈蚀层数（钉枪，0-3）
      rustHits: 0,        // 锈蚀叠层命中计数
      chainHits: 0,       // 链式反应命中计数（叠满锈蚀后）
      freezeStacks: 0,    // 冻伤层数（液氮，0-3）
      frozen: false,      // 冻结状态
      frozenUntil: 0,     // 冻结结束时间
      frozenImmuneUntil: 0, // 定身免疫（隐藏：定身后2s免疫）
      armor: typeDef.isBoss ? bossArmor : (typeDef.armor || 0),  // 护甲减伤（Boss分波50%/80%，重甲0.8）
      armorBreak: 0,      // 破甲（液氮冻结，0-0.6）
      arcArmorReduce: 0,  // 电弧降减伤（超载，0.15，独立乘区）
      hitCount: 0,        // 受击次数（矩阵追击用）
      lastPursuitTime: -9999, // 上次追击时间
      invulnUntil: 0,     // 破盾后无敌结束时间
      chargeState: false, // 冲锋状态（冲锋怪/第10波Boss受击3次后触发）
      bossCharges: bossCharges,   // 第10波Boss冲锋机制标记
      bossBaseSpeed: typeDef.isBoss ? bossSpeed : 0,  // Boss面板基础移速
      chargeSpeed: bossCharges ? 1.0 : 0,             // Boss冲锋后面板移速（上限1.0）
      baseSlowFactor: 1,  // 基础减速因子（液氮）
      baseSlowUntil: 0,   // 基础减速结束时间
    };

    this.enemies.push(enemy);
    TestLog.info('ENEMY', `生成 ${typeDef.name} #${enemy.id}, HP: ${enemy.maxHp} (波次${waveNum}, 倍率${waveMult.toFixed(1)}x)`);
    return enemy;
  },

  // 在指定位置生成敌人（用于分裂）
  createAtPosition(typeId, waveNum, x, y, pathIdx, skipShield = false) {
    const typeDef = CONFIG.ENEMY_TYPES[typeId];
    if (!typeDef) return null;

    const diff = CONFIG.DIFFICULTY[Settings.difficulty];
    const waveMult = CONFIG.getWaveHpMult(waveNum);

    const enemy = {
      id: this.nextId++,
      type: typeId,
      typeDef: typeDef,
      x: x,
      y: y,
      maxHp: Math.floor(typeDef.hp * diff.hpMult * waveMult),
      hp: Math.floor(typeDef.hp * diff.hpMult * waveMult),
      baseSpeed: typeDef.speed * diff.speedMult * CONFIG.getSpeedMult(waveNum),
      speedMult: 1.0,
      speed: typeDef.speed * diff.speedMult * CONFIG.getSpeedMult(waveNum),
      slowUntil: 0,
      goldReward: typeDef.gold,
      pathIndex: pathIdx,
      dead: false,
      reached: false,
      size: typeDef.size,
      color: typeDef.color,
      flying: typeDef.flying || false,
      isBoss: typeDef.isBoss || false, isCharger: typeDef.isCharger || false,
      regen: typeDef.regen || 0,
      rustStacks: 0, rustHits: 0, chainHits: 0,
      freezeStacks: 0, frozen: false, frozenUntil: 0, frozenImmuneUntil: 0,
      armor: typeDef.armor || 0, armorBreak: 0, arcArmorReduce: 0,
      hitCount: 0, lastPursuitTime: -9999, invulnUntil: 0, chargeState: false,
      baseSlowFactor: 1, baseSlowUntil: 0,
      shieldStacks: skipShield ? 0 : CONFIG.getShieldStacks(waveNum),
      shieldRefreshHits: 0,
      isShieldBoss: false,
    };

    this.enemies.push(enemy);
    TestLog.info('ENEMY', `分裂生成 ${typeDef.name} #${enemy.id} 在 (${Math.floor(x)},${Math.floor(y)}) pathIdx=${pathIdx}`);
    return enemy;
  },

  update(delta, now) {
    for (const enemy of this.enemies) {
      if (enemy.dead || enemy.reached) continue;

      // 减速效果（乘法叠加：基础减速 × 冻伤 × 冻结定身）
      let slowFactor = 1;
      if (enemy.baseSlowUntil > 0 && now < enemy.baseSlowUntil) {
        slowFactor *= enemy.baseSlowFactor;
      }
      slowFactor *= Math.pow(0.85, enemy.freezeStacks); // 冻伤每层-15%
      if (enemy.frozen) {
        if (now >= enemy.frozenUntil) {
          enemy.frozen = false; // 冻结结束
          enemy.frozenImmuneUntil = now + 2000; // 定身后2s免疫（隐藏机制）
        } else {
          slowFactor *= 0; // 冻结定身：移速归0
        }
      }
      enemy.speedMult = Math.max(0, slowFactor);

      // 生命回复（巨魔）
      if (enemy.regen > 0 && enemy.hp < enemy.maxHp) {
        enemy.hp = Math.min(enemy.maxHp, enemy.hp + enemy.regen * delta / 1000);
      }

      // 移动（冲锋怪/第10波Boss受击后进入冲锋状态，移速提升）
      let speedScale = 1;
      if (enemy.typeDef?.isCharger && enemy.chargeState) {
        speedScale = enemy.typeDef.chargeSpeed / enemy.typeDef.speed;
      }
      // 第10波Boss冲锋：移速上限1.0（1.0 / 面板基础0.5 = 2倍）
      if (enemy.bossCharges && enemy.chargeState && enemy.chargeSpeed) {
        speedScale = enemy.chargeSpeed / enemy.bossBaseSpeed;
      }
      const currentSpeed = enemy.baseSpeed * enemy.speedMult * speedScale;
      const moveAmount = currentSpeed * delta / 16.67; // 标准化到60fps

      let remaining = moveAmount;
      while (remaining > 0 && enemy.pathIndex < CONFIG.PATH.length - 1) {
        const target = CONFIG.PATH[enemy.pathIndex + 1];
        const tx = target.x * CONFIG.TILE_SIZE + CONFIG.TILE_SIZE / 2;
        const ty = target.y * CONFIG.TILE_SIZE + CONFIG.TILE_SIZE / 2;
        const dx = tx - enemy.x;
        const dy = ty - enemy.y;
        const d = Math.sqrt(dx * dx + dy * dy);

        if (d <= remaining) {
          enemy.x = tx;
          enemy.y = ty;
          remaining -= d;
          enemy.pathIndex++;
        } else {
          enemy.x += (dx / d) * remaining;
          enemy.y += (dy / d) * remaining;
          remaining = 0;
        }
      }

      // 到达终点
      if (enemy.pathIndex >= CONFIG.PATH.length - 1 && !enemy.reached) {
        enemy.reached = true;
        Stats.enemiesReached++;
        const livesLost = enemy.isBoss ? 5 : 1;
        Lives.lose(livesLost);
        TestLog.info('ENEMY', `${enemy.typeDef.name} #${enemy.id} 到达终点! 损失 ${livesLost} 生命`);
      }
    }

    // 清理死亡/到达的敌人，同时清空塔指向它们的 target 引用（避免攻击线残留到出口）
    const removedEnemies = this.enemies.filter(e => e.dead || e.reached);
    if (removedEnemies.length > 0) {
      const removedSet = new Set(removedEnemies);
      for (const t of TowerSystem.towers) {
        if (t.target && removedSet.has(t.target)) t.target = null;
      }
    }
    this.enemies = this.enemies.filter(e => !e.dead && !e.reached);
  },

  getAliveCount() {
    return this.enemies.filter(e => !e.dead && !e.reached).length;
  },

  reset() {
    this.enemies = [];
    this.nextId = 1;
  }
};

// ==================== 生命系统 ====================
const Lives = {
  lives: 0,

  init(startLives) {
    this.lives = startLives;
  },

  lose(amount) {
    this.lives = Math.max(0, this.lives - amount);
    TestLog.info('LIVES', `失去 ${amount} 生命, 剩余 ${this.lives}`);
    if (this.lives <= 0) {
      TestLog.info('LIVES', '生命归零，游戏结束');
      WaveManager.endGame(false);
    }
  },

  reset() {
    this.lives = 0;
  }
};

// ==================== 波次系统 ====================
const WaveManager = {
  currentWave: 0,
  totalWaves: CONFIG.TOTAL_WAVES,
  waveActive: false,
  waveSpawnQueue: [],
  currentWaves: [],  // 当前生成的波次数据
  snapshot: null,    // 波次开始前的完整快照（金币/装置/Buff/生命/统计）

  init() {
    const generated = CONFIG.generateWaves();
    this.currentWaves = generated.waves;
    this.currentWave = 0;
    this.totalWaves = CONFIG.TOTAL_WAVES;
    this.waveActive = false;
    this.waveSpawnQueue = [];
    this.waveStartTime = 0;
    this.snapshot = null;
  },

  startWave() {
    if (this.currentWave >= this.totalWaves) {
      TestLog.warn('WAVE', '所有波次已完成');
      return false;
    }
    if (this.waveActive) {
      TestLog.warn('WAVE', '波次已在进行中');
      return false;
    }

    // 保存「点开始波次」这一刻的快照（重置时回到这里：装置保留、怪物清空）
    this.saveSnapshot();

    this.currentWave++;
    this.waveActive = true;
    this.waveSpawnQueue = [];
    this.waveStartTime = GameLoop.gameTime;

    // 使用动态生成的波次数据
    const waveDef = this.currentWaves[this.currentWave - 1];
    this.waveSpawnQueue = this.buildSpawnQueue(waveDef);

    TestLog.info('WAVE', `波次 ${this.currentWave}/${this.totalWaves} 开始, 共 ${this.waveSpawnQueue.length} 个敌人`);
    UI.updateWaveButton();
    return true;
  },

  // 构建生成队列：小怪顺序衔接，大型怪物（巨像/Boss/初始体）穿插，避免排在最后等太久
  buildSpawnQueue(waveDef) {
    const queue = [];
    let smallOffset = 0;   // 小怪累计偏移（顺序衔接）
    let giantTimer = 5000; // 巨像从5秒起，按间隔错开

    for (const group of waveDef) {
      if (group.type === 'giant') {
        for (let i = 0; i < group.count; i++) {
          queue.push({ type: group.type, spawnAt: giantTimer + i * group.interval });
        }
        giantTimer += group.count * group.interval;
      } else if (group.type === 'boss') {
        // Boss 在小怪全部出完后 5 秒压轴登场（与小怪区别开）
        const bossStart = smallOffset + 5000;
        for (let i = 0; i < group.count; i++) {
          queue.push({ type: group.type, spawnAt: bossStart + i * group.interval });
        }
      } else if (group.type === 'slowgiant') {
        queue.push({ type: group.type, spawnAt: 2000 }); // 初始体波次开始2秒出现
      } else {
        // 小怪：顺序衔接
        for (let i = 0; i < group.count; i++) {
          queue.push({ type: group.type, spawnAt: smallOffset + i * group.interval });
        }
        smallOffset += group.count * group.interval;
      }
    }

    queue.sort((a, b) => a.spawnAt - b.spawnAt);
    return queue;
  },

  update(now) {
    if (!this.waveActive) return;

    const elapsed = now - this.waveStartTime;

    // 生成敌人
    while (this.waveSpawnQueue.length > 0 && this.waveSpawnQueue[0].spawnAt <= elapsed) {
      const spawn = this.waveSpawnQueue.shift();
      EnemySystem.create(spawn.type, this.currentWave);
    }

    // 检查波次完成
    if (this.waveSpawnQueue.length === 0 && EnemySystem.getAliveCount() === 0) {
      this.completeWave();
    }
  },

  completeWave() {
    this.waveActive = false;
    Stats.wavesCompleted++;
    this.waveSpawnQueue = [];

    // 波次通关奖励（10 + 6×波次）
    const bonus = 10 + this.currentWave * 6;
    Economy.earn(bonus);

    // 先结算已有Buff的波次计数（强力Buff到期）
    BuffSystem.onWaveComplete();

    // 5波一组：每组第4波结束触发赏金Buff（持续整个第5波）；最终波(20)不触发
    if (this.currentWave % 5 === 4 && this.currentWave < 19) {
      BuffSystem.activateBounty();
    }

    TestLog.info('WAVE', `波次 ${this.currentWave} 完成! 奖励 ${bonus} 金币`);

    // 成就检查
    if (this.currentWave >= 10) AchievementSystem.unlock('halfway');

    // 胜利检查
    if (this.currentWave >= this.totalWaves) {
      this.endGame(true);
      return;
    }

    UI.updateWaveButton();
  },

  endGame(victory) {
    this.waveActive = false;
    if (victory) {
      GameState.transition('VICTORY');
      AchievementSystem.unlock('victory');
      if (Lives.lives >= 15) AchievementSystem.unlock('flawless');
      TestLog.info('WAVE', '游戏胜利!');
    } else {
      GameState.transition('GAME_OVER');
      TestLog.info('WAVE', '游戏失败');
    }
    UI.showGameOver(victory);
  },

  isAllWavesDone() {
    return this.currentWave >= this.totalWaves && !this.waveActive &&
           EnemySystem.getAliveCount() === 0 && !GameState.state === 'VICTORY';
  },

  // 重置当前波次：清空敌人，重新生成当前波次的怪物，塔/金币/生命/Buff 保留
  // 保存波次开始前的完整快照（金币/装置/Buff/生命/统计）
  saveSnapshot() {
    this.snapshot = {
      gold: Economy.gold,
      lives: Lives.lives,
      towers: TowerSystem.towers.map(t => ({
        id: t.id, type: t.type, col: t.col, row: t.row, level: t.level,
        hitStreak: t.hitStreak, lastHitTime: t.lastHitTime, tempSpeedBonus: t.tempSpeedBonus,
        attackSpeedStacks: t.attackSpeedStacks, attackCount: t.attackCount,
        lastMagnetTime: t.lastMagnetTime, pursuitMode: t.pursuitMode,
        lastFireTime: t.lastFireTime, angle: t.angle,
      })),
      buff: {
        active: BuffSystem.active, type: BuffSystem.type,
        remainingWaves: BuffSystem.remainingWaves,
        damageMult: BuffSystem.damageMult, fireRateMult: BuffSystem.fireRateMult,
        goldBonusPerKill: BuffSystem.goldBonusPerKill,
      },
      stats: {
        kills: Stats.kills, totalGoldEarned: Stats.totalGoldEarned,
        totalGoldSpent: Stats.totalGoldSpent, enemiesReached: Stats.enemiesReached,
        towersPlaced: Stats.towersPlaced, towersUpgraded: Stats.towersUpgraded,
        towersSold: Stats.towersSold,
      },
    };
  },

  // 恢复到波次开始前的完整状态（金币/装置/Buff/生命/统计全回滚）
  restoreSnapshot() {
    if (!this.snapshot) return false;
    const s = this.snapshot;

    // 恢复金币、生命
    Economy.gold = s.gold;
    Lives.lives = s.lives;

    // 恢复统计
    Object.assign(Stats, s.stats);

    // 恢复 Buff
    Object.assign(BuffSystem, s.buff);

    // 恢复装置：清空地图塔格 + 重建 towers
    TowerSystem.towers = [];
    MapSystem.reset();
    for (const td of s.towers) {
      const typeDef = CONFIG.TOWER_TYPES[td.type];
      if (!typeDef) continue;
      const tower = {
        ...td,
        typeDef,
        x: td.col * CONFIG.TILE_SIZE + CONFIG.TILE_SIZE / 2,
        y: td.row * CONFIG.TILE_SIZE + CONFIG.TILE_SIZE / 2,
        target: null,
      };
      MapSystem.placeTower(td.col, td.row, tower);
      TowerSystem.towers.push(tower);
    }
    TowerSystem.nextId = s.towers.reduce((m, t) => Math.max(m, t.id), 0) + 1;

    // 清空敌人、弹丸
    EnemySystem.enemies = [];
    ProjectileSystem.projectiles = [];
    return true;
  },

  // 重置当前波次：回滚到该波次开始前的完整状态，重新生成怪物
  restartCurrentWave() {
    if (this.currentWave <= 0) {
      TestLog.warn('WAVE', '当前波次未开始，无法重置');
      UI.showToast('当前波次未开始');
      return false;
    }
    // 只在波次进行中允许重置；准备阶段（waveActive=false）拒绝，避免多次点击持续回滚
    if (!this.waveActive) {
      TestLog.warn('WAVE', '当前处于准备阶段，无进行中的波次可重置');
      UI.showToast('当前波次未进行，无需重置');
      return false;
    }
    if (GameState.state !== 'PLAYING' && GameState.state !== 'PAUSED') {
      TestLog.warn('WAVE', '游戏状态不允许重置');
      return false;
    }

    // 回滚到波次开始前（金币/装置/Buff/生命/统计全恢复）
    if (!this.restoreSnapshot()) {
      TestLog.error('WAVE', '无快照可恢复');
      return false;
    }

    // 回到准备阶段：波次号回退、清空生成队列，不自动生成怪物
    this.currentWave--;
    this.waveActive = false;
    this.waveSpawnQueue = [];

    // 如果当前是暂停状态，恢复到 PLAYING
    if (GameState.state === 'PAUSED') {
      GameState.transition('PLAYING');
      GameLoop.start();
    }

    TestLog.info('WAVE', `🔄 重置当前波次，已回到准备阶段（装置/金币恢复，等待重新开始）`);
    UI.updateAll();
    return true;
  },

  reset() {
    this.currentWave = 0;
    this.totalWaves = CONFIG.TOTAL_WAVES;
    this.waveActive = false;
    this.waveSpawnQueue = [];
    this.currentWaves = [];
    this.waveStartTime = 0;
    this.snapshot = null;
  }
};

// ==================== 成就系统 ====================
const AchievementSystem = {
  achievements: {
    first_blood:   { id:'first_blood',  name:'第一滴血',    desc:'击杀第一个敌人',         unlocked: false, icon: '🩸' },
    sharpshooter:  { id:'sharpshooter', name:'神射手',      desc:'拥有5座弓箭塔',          unlocked: false, icon: '🎯' },
    demolition:    { id:'demolition',   name:'拆迁队',      desc:'拥有3座炮塔',            unlocked: false, icon: '💥' },
    rich:          { id:'rich',         name:'小有积蓄',    desc:'金币达到1000',           unlocked: false, icon: '💰' },
    wealthy:       { id:'wealthy',      name:'富可敌国',    desc:'金币达到2000',           unlocked: false, icon: '💎' },
    halfway:       { id:'halfway',      name:'半程冠军',    desc:'通过第5波',              unlocked: false, icon: '🏅' },
    victory:       { id:'victory',      name:'地牢守护者',   desc:'通关全部10波',           unlocked: false, icon: '👑' },
    flawless:      { id:'flawless',     name:'完美防御',    desc:'通关时生命≥15',          unlocked: false, icon: '🛡️' },
  },

  unlock(id) {
    const ach = this.achievements[id];
    if (!ach) {
      TestLog.warn('ACHIEVEMENT', `无效成就ID: ${id}`);
      return;
    }
    if (ach.unlocked) return;

    ach.unlocked = true;
    TestLog.info('ACHIEVEMENT', `解锁成就: ${ach.name} - ${ach.desc}`);
    UI.showToast(`成就解锁: ${ach.icon} ${ach.name}`);
  },

  getUnlocked() {
    return Object.values(this.achievements).filter(a => a.unlocked);
  },

  reset() {
    for (const key in this.achievements) {
      this.achievements[key].unlocked = false;
    }
  },

  serialize() {
    const data = {};
    for (const key in this.achievements) {
      data[key] = this.achievements[key].unlocked;
    }
    return data;
  },

  deserialize(data) {
    if (!data) return;
    for (const key in data) {
      if (this.achievements[key]) {
        this.achievements[key].unlocked = data[key];
      }
    }
  }
};

// ==================== 存档系统 ====================
const SaveManager = {
  SAVE_KEY: 'dungeon_guardian_save',
  SETTINGS_KEY: 'dungeon_guardian_settings',
  ACHIEVEMENTS_KEY: 'dungeon_guardian_achievements',

  save() {
    try {
      const data = {
        version: '1.0.0',
        timestamp: Date.now(),
        gameState: GameState.state,
        gold: Economy.gold,
        lives: Lives.lives,
        wave: WaveManager.currentWave,
        waveActive: WaveManager.waveActive,
        stats: {
          kills: Stats.kills,
          totalGoldEarned: Stats.totalGoldEarned,
          wavesCompleted: Stats.wavesCompleted,
          towersPlaced: Stats.towersPlaced,
          towersUpgraded: Stats.towersUpgraded,
          towersSold: Stats.towersSold,
          enemiesReached: Stats.enemiesReached,
          elapsed: Stats.getElapsedTime(),
        },
        towers: TowerSystem.towers.map(t => ({
          type: t.type,
          col: t.col,
          row: t.row,
          level: t.level,
          id: t.id,
        })),
        enemies: EnemySystem.enemies.map(e => ({
          type: e.type,
          hp: e.hp,
          maxHp: e.maxHp,
          x: e.x,
          y: e.y,
          pathIndex: e.pathIndex,
          id: e.id,
        })),
        waveSpawnQueue: WaveManager.waveSpawnQueue,
        waveStartTime: WaveManager.waveStartTime,
        achievements: AchievementSystem.serialize(),
      };

      const json = JSON.stringify(data);

      // 数据完整性校验
      if (json.length < 10) {
        TestLog.error('SAVE', '存档数据异常：数据过短');
        return false;
      }

      localStorage.setItem(this.SAVE_KEY, json);
      TestLog.info('SAVE', `游戏已保存 (${json.length} bytes)`);
      UI.showToast('游戏已保存');
      return true;
    } catch (e) {
      TestLog.error('SAVE', `保存失败: ${e.message}`);
      UI.showToast('保存失败！请检查浏览器存储空间');
      return false;
    }
  },

  load() {
    try {
      const json = localStorage.getItem(this.SAVE_KEY);
      if (!json) {
        TestLog.info('SAVE', '无存档记录');
        return false;
      }

      const data = JSON.parse(json);

      // 数据完整性校验
      if (!data || !data.version) {
        TestLog.error('SAVE', '存档数据损坏：缺少版本号');
        return false;
      }
      if (typeof data.gold !== 'number' || data.gold < 0) {
        TestLog.error('SAVE', '存档数据异常：金币数据无效');
        return false;
      }
      if (!data.towers || !Array.isArray(data.towers)) {
        TestLog.warn('SAVE', '存档中塔数据异常，使用空列表');
        data.towers = [];
      }

      // 恢复游戏状态
      Economy.gold = data.gold;
      Lives.lives = data.lives;
      WaveManager.currentWave = data.wave || 0;
      WaveManager.waveActive = data.waveActive || false;
      Stats.kills = data.stats?.kills || 0;
      Stats.totalGoldEarned = data.stats?.totalGoldEarned || 0;
      Stats.wavesCompleted = data.stats?.wavesCompleted || 0;
      Stats.towersPlaced = data.stats?.towersPlaced || 0;
      Stats.towersUpgraded = data.stats?.towersUpgraded || 0;
      Stats.towersSold = data.stats?.towersSold || 0;
      Stats.enemiesReached = data.stats?.enemiesReached || 0;
      Stats.gameStartTime = Date.now() - ((data.stats?.elapsed || 0) * 1000);

      // 恢复塔
      TowerSystem.reset();
      MapSystem.reset();
      let maxTowerId = 0;
      for (const td of data.towers) {
        if (td.id > maxTowerId) maxTowerId = td.id;
        const typeDef = CONFIG.TOWER_TYPES[td.type];
        if (!typeDef) {
          TestLog.warn('SAVE', `跳过无效塔类型: ${td.type}`);
          continue;
        }
        const tower = {
          id: td.id,
          type: td.type,
          typeDef: typeDef,
          col: td.col,
          row: td.row,
          level: clamp(td.level || 0, 0, 2),
          lastFireTime: 0,
          target: null,
          angle: 0,
          x: td.col * CONFIG.TILE_SIZE + CONFIG.TILE_SIZE / 2,
          y: td.row * CONFIG.TILE_SIZE + CONFIG.TILE_SIZE / 2,
          hitStreak: 0, lastHitTime: 0, tempSpeedBonus: false,
          attackSpeedStacks: 0, attackCount: 0, lastMagnetTime: -9999,
          pursuitMode: false,
        };
        MapSystem.placeTower(td.col, td.row, tower);
        TowerSystem.towers.push(tower);
      }
      TowerSystem.nextId = maxTowerId + 1;

      // 恢复敌人
      EnemySystem.reset();
      let maxEnemyId = 0;
      for (const ed of data.enemies || []) {
        if (ed.id > maxEnemyId) maxEnemyId = ed.id;
        const typeDef = CONFIG.ENEMY_TYPES[ed.type];
        if (!typeDef) {
          TestLog.warn('SAVE', `跳过无效敌人类型: ${ed.type}`);
          continue;
        }
        const loadIsBoss = !!typeDef.isBoss;
        const loadBossIs20 = loadIsBoss && WaveManager.currentWave >= 20;
        const loadBossSpeed = loadIsBoss ? (loadBossIs20 ? 1.2 : 0.5) : typeDef.speed;
        EnemySystem.enemies.push({
          id: ed.id,
          type: ed.type,
          typeDef: typeDef,
          x: ed.x, y: ed.y,
          maxHp: ed.maxHp,
          hp: ed.hp,
          baseSpeed: loadBossSpeed * CONFIG.DIFFICULTY[Settings.difficulty].speedMult * CONFIG.getSpeedMult(WaveManager.currentWave),
          speedMult: 1.0,
          speed: loadBossSpeed * CONFIG.DIFFICULTY[Settings.difficulty].speedMult * CONFIG.getSpeedMult(WaveManager.currentWave),
          slowUntil: 0,
          goldReward: typeDef.gold,
          pathIndex: ed.pathIndex,
          dead: false,
          reached: false,
          size: typeDef.size,
          color: typeDef.color,
          flying: typeDef.flying || false,
          isBoss: loadIsBoss, isCharger: typeDef.isCharger || false,
          regen: typeDef.regen || 0,
          rustStacks: 0, rustHits: 0, chainHits: 0,
          freezeStacks: 0, frozen: false, frozenUntil: 0, frozenImmuneUntil: 0,
          armor: loadIsBoss ? (loadBossIs20 ? 0.8 : 0.5) : (typeDef.armor || 0), armorBreak: 0, arcArmorReduce: 0,
          hitCount: 0, lastPursuitTime: -9999, invulnUntil: 0, chargeState: false,
          bossCharges: loadIsBoss && !loadBossIs20, bossBaseSpeed: loadIsBoss ? loadBossSpeed : 0, chargeSpeed: (loadIsBoss && !loadBossIs20) ? 1.0 : 0,
          baseSlowFactor: 1, baseSlowUntil: 0,
          shieldStacks: 0, shieldRefreshHits: 0, isShieldBoss: loadBossIs20,
        });
      }
      EnemySystem.nextId = maxEnemyId + 1;

      // 恢复波次生成队列
      WaveManager.waveSpawnQueue = data.waveSpawnQueue || [];
      WaveManager.waveStartTime = data.waveStartTime || 0;

      // 恢复成就
      AchievementSystem.deserialize(data.achievements);

      // 恢复状态
      const loadedState = data.gameState === 'PAUSED' ? 'PAUSED' : 'PLAYING';
      GameState.transition(loadedState);

      TestLog.info('SAVE', `游戏已加载 (波次 ${WaveManager.currentWave})`);
      return true;
    } catch (e) {
      TestLog.error('SAVE', `加载失败: ${e.message}`);
      return false;
    }
  },

  hasSave() {
    try {
      const json = localStorage.getItem(this.SAVE_KEY);
      if (!json) return false;
      const data = JSON.parse(json);
      return data && data.version === '1.0.0';
    } catch {
      return false;
    }
  },

  delete() {
    localStorage.removeItem(this.SAVE_KEY);
    TestLog.info('SAVE', '存档已删除');
  }
};
